<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            text-align: center;
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 32px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .video-btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .video-btn {
            padding: 18px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .video-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .video-btn:active::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: btnRipple 0.6s ease-out;
        }

        @keyframes btnRipple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .video-container {
            max-width: 800px;
            width: 100%;
            margin: 40px auto 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: none;
            background: rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .playing-tip {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            height: 24px;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
                margin-bottom: 25px;
            }
            .video-btn {
                font-size: 14px;
                padding: 14px 0;
            }
            .video-btn-group {
                gap: 12px;
            }
            .video-container {
                margin-top: 25px;
                border-radius: 8px;
            }
            .back-btn {
                padding: 10px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h1 class="page-title">教程类(点击按钮后往下滑)</h1>
    
    <div class="video-btn-group">
        <button class="video-btn" onclick="playVideo('A.mp4')">shizuku</button>
        <button class="video-btn" onclick="playVideo('B.mp4')">改文件</button>
        <button class="video-btn" onclick="playVideo('C.mp4')">Root</button>
        <button class="video-btn" onclick="playVideo('D.mp4')">端口制作</button>
        <button class="video-btn" onclick="playVideo('E.mp4')">shizuku 电脑激活</button>
        <button class="video-btn" onclick="playVideo('F.mp4')">挖掘机（无用）</button>
        <button class="video-btn" onclick="playVideo('G.mp4')">改比例</button>
        <button class="video-btn" onclick="playVideo('H.mp4')">端口使用</button>
        <button class="video-btn" onclick="playVideo('i.mp4')">直登号使用</button>
        <button class="video-btn" onclick="playVideo('J.mp4')">直登号失败</button>
    </div>

    <div class="playing-tip" id="playingTip">点击按钮播放视频</div>

    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        const videoPlayer = document.getElementById("videoPlayer");
        const videoContainer = document.getElementById("videoContainer");
        const playingTip = document.getElementById("playingTip");
        const videoFolderPath = "./sp/";

        function playVideo(filename) {
            const videoSrc = videoFolderPath + filename;
            videoPlayer.src = videoSrc;
            videoContainer.style.display = "block";
            videoPlayer.play();
            playingTip.innerText = `正在播放：${filename}`;
        }
    </script>
    <script src="sp/musicPlayer.js"></script>
</body>
</html>
