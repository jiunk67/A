          <script>
    // 断网检测+跳转核心函数
function checkNetworkAndJump(targetUrl) {
    const offlinePage = document.getElementById('offlinePage');
    const offlineMessage = document.getElementById('offlineMessage');
    if (navigator.onLine) {
        offlinePage.style.display = 'none';
        offlineMessage.style.display = 'none';
        window.location.href = targetUrl;
    } else {
        offlinePage.style.display = 'flex';
        offlineMessage.style.display = 'block';
    }
}

// 监听网络状态变化
window.addEventListener('online', function() {
    document.getElementById('offlinePage').style.display = 'none';
    document.getElementById('offlineMessage').style.display = 'none';
});

window.addEventListener('offline', function() {
    document.getElementById('offlinePage').style.display = 'flex';
    document.getElementById('offlineMessage').style.display = 'block';
});
    </script>
