<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味食谱探索 - PearAPI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap'); /* A nice cursive font for flair */

        :root {
            --primary-color: #FF6F61; /* Living Coral - warm and inviting */
            --primary-light: #FF8A80;
            --secondary-color: #6ABD7A; /* Soft, fresh green */
            --accent-color: #FFD166; /* Sunny Yellow - for highlights */
            --background-color: #FFFBF7; /* Very light creamy peach */
            --card-background: #ffffff;
            --text-color: #4A4A4A; /* Dark grey, not black */
            --light-text-color: #7B7B7B;
            --border-color: #EAEAEA;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.1);
            --border-radius-main: 12px;
            --border-radius-small: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll from subtle animations */
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 0;
        }

        /* Header Styling */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            padding: 40px 0 50px; /* Increased padding for a grander feel */
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 111, 97, 0.3); /* Shadow matching primary color */
            position: relative;
            overflow: hidden; /* For pseudo-elements if added */
        }

        header::before { /* Subtle decorative element */
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 100px;
            background-color: var(--background-color);
            border-radius: 50%;
            opacity: 0.8;
            z-index: 0;
        }


        header .container {
            position: relative; /* To keep content above pseudo-elements */
            z-index: 1;
        }


        header h1 {
            font-family: 'Pacifico', cursive; /* Fun, thematic font for the main title */
            font-size: 3.8em;
            margin-bottom: 25px;
            font-weight: 400; /* Pacifico is usually best at normal weight */
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        header h1 .icon {
            font-family: 'Noto Sans SC', sans-serif; /* Revert for emoji */
            font-size: 0.8em; /* Adjust emoji size */
            margin-right: 15px;
            transform: rotate(-10deg); /* Playful tilt */
        }


        .search-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 50px; /* Fully rounded container */
        }

        .search-bar input[type="text"] {
            padding: 15px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 40px 0 0 40px; /* Rounded on the left */
            width: 70%;
            outline: none;
            transition: box-shadow 0.3s ease, width 0.3s ease;
            background-color: #fff;
            color: var(--text-color);
        }
        .search-bar input[type="text"]::placeholder {
            color: #aaa;
        }
        .search-bar input[type="text"]:focus {
            box-shadow: 0 0 0 3px var(--accent-color);
            width: 75%;
        }

        .search-bar button {
            padding: 15px 30px;
            font-size: 1.1em;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 0 40px 40px 0; /* Rounded on the right */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        .search-bar button svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }

        .search-bar button:hover {
            background-color: #57a868; /* Darker green */
            transform: scale(1.05);
        }

        /* Main Content Styling */
        main {
            flex-grow: 1;
            padding: 40px 0;
        }

        #results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .recipe-card {
            background-color: var(--card-background);
            border-radius: var(--border-radius-main);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
        }

        .recipe-card .image-container {
            width: 100%;
            height: 250px; /* Increased image height */
            overflow: hidden; /* Ensure image zoom effect stays within bounds */
        }
        .recipe-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.4s ease;
        }
        .recipe-card:hover img {
            transform: scale(1.05); /* Subtle zoom on hover */
        }
        
        .recipe-card .no-image {
            width: 100%;
            height: 250px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--light-text-color);
            font-style: italic;
            border-bottom: 1px solid var(--border-color);
        }
        .recipe-card .no-image svg {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            opacity: 0.5;
        }


        .recipe-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-content h3 {
            font-size: 1.8em; /* Slightly larger */
            color: var(--primary-color);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .recipe-content .label {
            font-weight: 700;
            color: var(--secondary-color);
            margin-top: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            font-size: 1.15em;
        }
        .recipe-content .label svg {
            margin-right: 8px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }


        .recipe-content p, .recipe-content div {
            font-size: 0.98em;
            color: var(--light-text-color);
            margin-bottom: 12px;
        }
        .recipe-content > p { /* For description directly under h3 */
            color: var(--text-color);
            margin-bottom: 15px;
        }
        
        .recipe-content div.materials, .recipe-content div.practice {
            padding: 15px;
            background-color: #fdfdfd; /* Very light grey for distinction */
            border-radius: var(--border-radius-small);
            border: 1px solid var(--border-color);
            margin-top: 5px;
            white-space: pre-line;
        }
        .recipe-content div.materials ul, .recipe-content div.practice ol {
            padding-left: 20px; /* For actual list items if they were structured */
        }
        .recipe-content div.materials p, .recipe-content div.practice p {
            margin-bottom: 5px; /* Adjust spacing for content within these blocks */
        }


        #message-area {
            text-align: center;
            font-size: 1.25em;
            padding: 40px 20px;
            color: var(--light-text-color);
            background-color: var(--card-background);
            border-radius: var(--border-radius-main);
            box-shadow: var(--shadow);
            margin: 20px auto;
            max-width: 600px;
        }
        
        #message-area.loading::before {
            content: '🍲'; /* Switched to a pot emoji */
            display: block; /* On its own line */
            animation: shake-cook 1.5s cubic-bezier(.36,.07,.19,.97) infinite;
            font-size: 3em;
            margin: 0 auto 15px;
        }

        @keyframes shake-cook { /* More playful loading animation */
            0%, 100% { transform: translateX(0) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        @keyframes spin { /* Kept for fallback or other uses if needed */
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer Styling */
        footer {
            background-color: #4A4A4A; /* Darker background for contrast */
            color: #E0E0E0; /* Lighter text for readability */
            text-align: center;
            padding: 25px 0;
            margin-top: auto;
        }
        footer p {
            font-size: 0.95em;
        }
        footer a {
            color: var(--accent-color); /* Use accent for links */
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #FFB74D; /* Slightly darker accent on hover */
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.8em;
            }
            header h1 .icon {
                font-size: 0.7em;
                margin-right: 10px;
            }
            .search-bar {
                flex-direction: column;
                background-color: transparent;
                padding: 0;
            }
            .search-bar input[type="text"] {
                width: 100%;
                border-radius: 40px; /* Full round when stacked */
                margin-bottom: 10px;
                text-align: center;
            }
            .search-bar input[type="text"]:focus {
                width: 100%;
            }
            .search-bar button {
                width: 100%;
                border-radius: 40px; /* Full round when stacked */
                justify-content: center;
            }
            #results-container {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            .recipe-card .image-container, .recipe-card .no-image {
                height: 220px;
            }
        }
        @media (max-width: 480px) {
            header h1 {
                font-size: 2.4em;
            }
            .recipe-content h3 {
                font-size: 1.6em;
            }
            .recipe-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><span class="icon">🍽️</span>美味食谱探索</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="例如：香煎三文鱼配芦笋">
                <button id="searchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"></path></svg>
                    搜菜谱
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="message-area">输入菜名，开启您的美味之旅吧！✨</div>
            <div id="results-container">
                <!-- Recipe cards will be injected here by JS -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© <span id="currentYear"></span> 食谱搜索. 用心发现每一道美味. Powered by <a href="https://api.pearktrue.cn/" target="_blank">PearAPI</a>.</p>
        </div>
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('results-container');
        const messageArea = document.getElementById('message-area');

        const API_URL = 'https://api.pearktrue.cn/api/cookbook/';

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                showMessage('别急，先告诉我您想做什么菜？😊');
                resultsContainer.innerHTML = '';
                return;
            }

            showLoading(true, '大厨正在快马加鞭为您查找... 🍳');
            resultsContainer.innerHTML = ''; 

            try {
                const response = await fetch(`${API_URL}?search=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    // Try to parse error response if backend sends JSON for errors
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        // Not a JSON error response
                    }
                    const statusText = response.statusText || (errorData ? errorData.msg : '');
                    throw new Error(`网络请求失败 (${response.status}${statusText ? ': ' + statusText : ''})`);
                }

                const data = await response.json();

                if (data.code === 200 && data.data && data.data.length > 0) {
                    displayRecipes(data.data);
                    showLoading(false); 
                } else if (data.code === 200 && (!data.data || data.data.length === 0)) {
                    showMessage(`哎呀，没找到关于 "${data.search || query}" 的食谱，换个关键词试试？🤔`);
                } else {
                    showMessage(data.msg || '获取食谱信息失败了，请稍后再试。');
                }

            } catch (error) {
                console.error('Search error:', error);
                showMessage(`搜索出了一点小问题: ${error.message} 🛠️`);
            } finally {
                // General cleanup for loading state, if not handled by specific paths
                if (messageArea.classList.contains('loading') && resultsContainer.children.length === 0) {
                   // Message should have been set by showMessage in error/no-data cases
                } else if (resultsContainer.children.length > 0) {
                    messageArea.style.display = 'none';
                }
            }
        }

        function displayRecipes(recipes) {
            resultsContainer.innerHTML = ''; 
            recipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';

                let imageHtml = '';
                if (recipe.image && recipe.image.startsWith('http')) {
                    imageHtml = `<div class="image-container"><img src="${recipe.image}" alt="${recipe.name}" onerror="this.closest('.image-container').innerHTML = createNoImagePlaceholder('图片加载失败');"></div>`;
                } else {
                    imageHtml = createNoImagePlaceholder('暂无图片');
                }
                
                card.innerHTML = `
                    ${imageHtml}
                    <div class="recipe-content">
                        <h3>${recipe.name || '未知菜名'}</h3>
                        
                        ${recipe.description ? `<p>${sanitizeHTML(recipe.description)}</p>` : ''}
                        
                        ${recipe.materials ? `
                            <span class="label">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20.548 5.607A10.988 10.988 0 0 0 12.866.027L12.594 0H11.408l-.272.027A10.99 10.99 0 0 0 3.452 5.607L2.062 10h19.876l-1.39-4.393zM12 2c4.962 0 9 3.826 9 8.5V20H3v-9.5C3 5.826 7.038 2 12 2zm1 13h-2v-2h2v2zm0-4h-2V9h2v2z"></path></svg>
                                材料准备:
                            </span>
                            <div class="materials">${formatRecipeSection(recipe.materials)}</div>` : ''}
                        
                        ${recipe.practice ? `
                            <span class="label">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 2H8C4.691 2 2 4.691 2 8v13a1 1 0 0 0 1 1h13c3.309 0 6-2.691 6-6V8c0-3.309-2.691-6-6-6zm4 14c0 2.206-1.794 4-4 4H4V8c0-2.206 1.794-4 4-4h8c2.206 0 4 1.794 4 4v8z"></path><path d="M7 9h10v2H7zm0 4h10v2H7zm0 4h5v2H7z"></path></svg>
                                烹饪步骤:
                            </span>
                            <div class="practice">${formatRecipeSection(recipe.practice)}</div>` : ''}
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
             // After adding cards, ensure message area is hidden if it was visible
            if (recipes.length > 0) {
                messageArea.style.display = 'none';
            }
        }
        
        function createNoImagePlaceholder(text) {
            return `<div class="no-image">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path>
                            <path d="M13 7h-2v6h2V7zm0 8h-2v2h2v-2z"></path>
                            <path d="m14.829 16.243-2.122-2.121L10.586 16.243C9.311 14.967 9.311 12.889 10.586 11.614l2.121-2.121L14.828 11.614C16.104 12.889 16.104 14.967 14.829 16.243zM12 10.189l-1.414 1.414 2.121 2.121L14.121 12.31C13.558 11.746 12.625 11.746 12 12.31zM9.757 13.029l1.414-1.414L9.05 9.494C7.775 10.77 7.775 12.848 9.05 14.123l2.121 2.121-1.414 1.414C8.343 16.243 8.343 14.165 9.757 13.029z"></path>
                        </svg>
                        <span>${text}</span>
                    </div>`;
        }

        function sanitizeHTML(str) {
            // Basic sanitization: prevent script injection from description if API could be compromised
            // For more robust sanitization, use a library like DOMPurify
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML.replace(/<br\s*\/?>/gi, '\n'); // Convert <br> to newlines for pre-line
        }

        function formatRecipeSection(htmlString) {
            // The API returns strings with <br> tags. We'll keep them for pre-line.
            // This function could be expanded to parse and reformat if needed,
            // e.g., to convert <br> separated items into actual <li>.
            // For now, just pass it through for `white-space: pre-line;` to handle.
            // A simple sanitization for safety, although less critical here than description.
            const temp = document.createElement('div');
            temp.innerHTML = htmlString; // Allow trusted HTML like <br>
            
            // Example: If you wanted to wrap each line (separated by <br>) in a <p>
            // return temp.innerHTML.split(/<br\s*\/?>/gi).map(line => `<p>${line.trim()}</p>`).join('');
            
            return temp.innerHTML; // Return the "cleaned" HTML.
        }

        function showMessage(msg) {
            messageArea.innerHTML = sanitizeHTML(msg); // Sanitize to be safe with user input in msg
            messageArea.classList.remove('loading');
            messageArea.style.display = 'block';
        }

        function showLoading(isLoading, msg = '正在加载中...') {
            if (isLoading) {
                messageArea.innerHTML = sanitizeHTML(msg);
                messageArea.classList.add('loading');
                messageArea.style.display = 'block';
            } else {
                messageArea.classList.remove('loading');
                if(resultsContainer.children.length === 0 && messageArea.textContent === msg) {
                    // This case implies loading finished but no results (or an error message was already set)
                    // showMessage should have handled setting the correct text.
                } else if (resultsContainer.children.length > 0) {
                    messageArea.style.display = 'none';
                }
            }
        }
        
        // Initial message
        showMessage('输入菜名，开启您的美味之旅吧！✨');

    </script>
</body>
</html>
