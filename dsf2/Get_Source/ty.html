<!DOCTYPE html>

<meta charset="UTF-8"/>

<title>海盒影视聚合 </title>
<style>
:root{--p:#667eea;--s:#764ba2;--bg:#f8fafc;--c:#fff;--t:#1e293b;--m:#64748b;--r:18px;}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--t);padding:20px}
.container{max-width:1000px;margin:0 auto}
.header{position:sticky;top:0;z-index:1000;margin:0 auto 40px;text-align:center;background:var(--bg);padding:10px 0}
.title{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{background:var(--c);border-radius:var(--r);box-shadow:0 2px 12px rgba(0,0,0,.06);padding:18px 8px;text-align:center;cursor:pointer;transition:.35s;font-size:.9rem}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
@media(max-width:600px){.title{font-size:1.8rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
