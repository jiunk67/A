<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋风赞助--破解神秘车车</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            padding: 20px;
            background-image: url('likn.png'), linear-gradient(135deg, #6e8efb, #a777e3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .logo-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            animation: rotate 15s linear infinite;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .download-btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .download-btn i {
            font-size: 20px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn-gaokao {
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            color: white;
        }
        
        .btn-moni {
            background: linear-gradient(45deg, #00cdac, #02aab0);
            color: white;
        }
        
        .btn-driver {
            background: linear-gradient(45deg, #4776E6, #8E54E9);
            color: white;
        }
        
        .btn-happy {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
        }
        
        .author-note {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid rgba(255, 255, 255, 0.5);
        }
        
        .author-note h3 {
            color: white;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .author-note p {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            font-size: 16px;
        }
        
        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
            
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .logo {
                width: 120px;
                height: 120px;
                font-size: 18px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">学习资料库</div>
        </div>
        
        <div class="glass-panel">
            <div class="button-grid">
                <button class="download-btn btn-gaokao" onclick="window.open('https://qwwqe.lanzoul.com/b00g3fwssj', '_blank')">
                    <i class="fas fa-graduation-cap"></i> 5年高考
                </button>
                
                <button class="download-btn btn-moni" onclick="window.open('https://qwwqe.lanzoul.com/b00g3fwt7e', '_blank')">
                    <i class="fas fa-book"></i> 三年模拟
                </button>
                
                <button class="download-btn btn-driver" onclick="window.open('https://qwwqe.lanzoul.com/b00g3fwt0h', '_blank')">
                    <i class="fas fa-car"></i> 老司机
                </button>
                
                <button class="download-btn btn-happy" onclick="window.open('https://qwwqe.lanzoul.com/b00g3fwthe', '_blank')">
                    <i class="fas fa-laugh"></i> 快乐源泉
                </button>
            </div>
            
            <div class="author-note">
                <h3><i class="fas fa-comment-dots"></i> 作者留言</h3>
                <p>本站提供优质学习资源下载，分类整理便于查找。所有资料均来自网络收集，仅供学习交流使用，请勿用于商业用途。下载后请于24小时内删除，如果喜欢请购买正版支持作者！</p>
            </div>
        </div>
    </div>

    <script>
        // 如果背景图片加载失败，使用纯色背景
        document.addEventListener('DOMContentLoaded', function() {
            const bgImage = new Image();
            bgImage.src = 'likn.png';
            bgImage.onerror = function() {
                document.body.style.backgroundImage = 'linear-gradient(135deg, #6e8efb, #a777e3)';
            };
        });
    </script>
</body>
</html>
