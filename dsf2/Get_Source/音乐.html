<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
            min-height: 100vh;
            padding: 20px 15px 100px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            margin-top: 5px;
        }

        .search-box {
            background-color: white;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 5px 10px;
            color: #333;
        }

        .search-box button {
            background: linear-gradient(to right, #6e8efb, #a777e3);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 3px 8px rgba(110, 142, 251, 0.3);
        }

        .search-box button:active {
            transform: scale(0.95);
        }

        .results-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            max-height: 50vh;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #555;
            padding-left: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .results-title span {
            color: #6e8efb;
            font-size: 14px;
            font-weight: normal;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .song-item:hover {
            background-color: rgba(110, 142, 251, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
        }

        .song-item.active {
            background-color: rgba(110, 142, 251, 0.1);
            border-color: #6e8efb;
        }

        .song-cover {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #a777e3, #6e8efb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            overflow: hidden;
        }

        .song-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-info p {
            font-size: 13px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        .song-actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .play-btn {
            background-color: #6e8efb;
            color: white;
            box-shadow: 0 3px 8px rgba(110, 142, 251, 0.3);
        }

        .download-btn {
            background-color: #f5f5f5;
            color: #666;
        }

        .play-btn:active, .download-btn:active {
            transform: scale(0.9);
        }

        .player-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            max-width: 500px;
            margin: 0 auto;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .player-container.hidden {
            transform: translateY(150%);
        }

        .now-playing {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .now-playing-cover {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, #a777e3, #6e8efb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            margin-right: 15px;
            flex-shrink: 0;
            animation: rotateAlbum 15s linear infinite;
            animation-play-state: paused;
        }

        .now-playing-cover.playing {
            animation-play-state: running;
        }

        @keyframes rotateAlbum {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .now-playing-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .now-playing-info p {
            font-size: 14px;
            color: #777;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #6e8efb;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:active {
            background-color: rgba(110, 142, 251, 0.1);
            transform: scale(0.95);
        }

        .play-pause-btn {
            background-color: #6e8efb;
            color: white;
            width: 60px;
            height: 60px;
            box-shadow: 0 5px 15px rgba(110, 142, 251, 0.3);
        }

        .progress-container {
            flex: 1;
            margin: 0 15px;
        }

        .progress-bar {
            height: 5px;
            background-color: #eee;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 5px;
        }

        .progress {
            height: 100%;
            background-color: #6e8efb;
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        .quality-container {
            margin-top: 15px;
        }

        .quality-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quality-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quality-btn {
            padding: 6px 12px;
            border-radius: 15px;
            background-color: #f0f0f0;
            border: none;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .quality-btn.active {
            background-color: #6e8efb;
            color: white;
        }

        .quality-btn:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .loading i {
            font-size: 30px;
            margin-bottom: 10px;
            color: #6e8efb;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .error-message {
            background-color: rgba(255, 87, 87, 0.1);
            color: #ff5757;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        @media (max-width: 380px) {
            .song-actions {
                flex-direction: column;
                gap: 5px;
            }
            
            .song-actions button {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            
            .quality-btn {
                font-size: 11px;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>网易云音乐播放器</h1>
            <p>点击播放的是什么音质下载的就是什么音质哦</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">发生错误，请稍后再试</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索歌曲、歌手或专辑...">
            <button id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="results-container">
            <div class="results-title">
                搜索结果
                <span id="resultsCount">0 首歌曲</span>
            </div>
            
            <div id="resultsList">
                <div class="empty-state">
                    <i class="fas fa-music"></i>
                    <p>输入关键词搜索音乐</p>
                </div>
            </div>
        </div>

        <div class="player-container hidden" id="playerContainer">
            <div class="now-playing">
                <div class="now-playing-cover" id="nowPlayingCover">
                    <i class="fas fa-music"></i>
                </div>
                <div class="now-playing-info">
                    <h3 id="nowPlayingTitle">未选择歌曲</h3>
                    <p id="nowPlayingArtist">-</p>
                </div>
            </div>

            <div class="player-controls">
                <button class="control-btn" id="prevBtn">
                    <i class="fas fa-step-backward"></i>
                </button>
                
                <button class="play-pause-btn" id="playPauseBtn">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                
                <button class="control-btn" id="nextBtn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="quality-container">
                <div class="quality-title">
                    <i class="fas fa-volume-up"></i>
                    <span>音质选择</span>
                </div>
                <div class="quality-selector">
                    <button class="quality-btn active" data-quality="hires">高清音质</button>
                    <button class="quality-btn" data-quality="lossless">无损音质</button>
                    <button class="quality-btn" data-quality="exhigh">极高音质</button>
                    <button class="quality-btn" data-quality="higher">较高音质</button>
                    <button class="quality-btn" data-quality="standard">标准音质</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        // DOM元素
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsList = document.getElementById('resultsList');
        const resultsCount = document.getElementById('resultsCount');
        const playerContainer = document.getElementById('playerContainer');
        const nowPlayingCover = document.getElementById('nowPlayingCover');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingArtist = document.getElementById('nowPlayingArtist');
        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const qualityButtons = document.querySelectorAll('.quality-btn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // 全局变量
        let currentSongs = [];
        let currentIndex = -1;
        let currentQuality = 'hires';
        let isPlaying = false;
        let searchInProgress = false;

        // 音质名称映射
        const qualityNames = {
            'standard': '标准音质',
            'higher': '较高音质',
            'exhigh': '极高音质',
            'lossless': '无损音质',
            'hires': '高清音质'
        };

        // 事件监听器
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);

        audioPlayer.addEventListener('loadedmetadata', updateDuration);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', playNext);
        audioPlayer.addEventListener('error', handleAudioError);

        qualityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentQuality = btn.dataset.quality;
                
                // 如果当前有歌曲在播放，重新获取新音质的链接
                if (currentIndex !== -1) {
                    const song = currentSongs[currentIndex];
                    playSong(song, currentIndex);
                }
            });
        });

        // 搜索音乐
        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                showError('请输入搜索关键词');
                return;
            }
            
            if (searchInProgress) {
                showError('正在搜索中，请稍候');
                return;
            }
            
            searchInProgress = true;
            showLoading();
            
            try {
                // 调用搜索API
                const response = await fetch(`https://node.api.xfabe.com/api/wangyi/search?search=${encodeURIComponent(query)}&limit=15`);
                
                if (!response.ok) {
                    throw new Error('搜索失败，请检查网络连接');
                }
                
                const data = await response.json();
                
                if (data.code !== 200 || !data.data || !data.data.songs) {
                    throw new Error('未找到相关歌曲');
                }
                
                currentSongs = data.data.songs;
                displayResults(currentSongs);
                
                // 隐藏错误消息
                hideError();
                
            } catch (error) {
                showError(error.message);
                displayEmptyResults();
            } finally {
                searchInProgress = false;
            }
        }

        // 显示加载状态
        function showLoading() {
            resultsList.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>正在搜索中...</p>
                </div>
            `;
            resultsCount.textContent = '搜索中...';
        }

        // 显示搜索结果
        function displayResults(songs) {
            if (!songs || songs.length === 0) {
                displayEmptyResults();
                return;
            }
            
            let html = '';
            
            songs.forEach((song, index) => {
                // 格式化时长 (毫秒转换为分:秒)
                const minutes = Math.floor(song.duration / 60000);
                const seconds = Math.floor((song.duration % 60000) / 1000).toString().padStart(2, '0');
                
                html += `
                    <div class="song-item ${index === currentIndex ? 'active' : ''}" data-index="${index}">
                        <div class="song-cover">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="song-info">
                            <h3>${song.name}</h3>
                            <p>${song.artistsname} · ${song.album} · ${minutes}:${seconds}</p>
                        </div>
                        <div class="song-actions">
                            <button class="play-btn" data-index="${index}">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="download-btn" data-index="${index}">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            resultsList.innerHTML = html;
            resultsCount.textContent = `${songs.length} 首歌曲`;
            
            // 为每首歌曲添加事件监听器
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    const song = songs[index];
                    playSong(song, index);
                });
            });
            
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    const song = songs[index];
                    downloadSong(song);
                });
            });
            
            // 点击整行也可以播放
            document.querySelectorAll('.song-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.song-actions')) {
                        const index = parseInt(item.dataset.index);
                        const song = songs[index];
                        playSong(song, index);
                    }
                });
            });
        }

        // 显示空结果状态
        function displayEmptyResults() {
            resultsList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p>未找到相关歌曲，请尝试其他关键词</p>
                </div>
            `;
            resultsCount.textContent = '0 首歌曲';
        }

        // 播放歌曲
        async function playSong(song, index) {
            try {
                // 更新当前播放索引
                currentIndex = index;
                
                // 更新UI显示当前播放的歌曲
                document.querySelectorAll('.song-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelectorAll(`.song-item[data-index="${index}"]`).forEach(item => {
                    item.classList.add('active');
                });
                
                // 更新播放器显示
                nowPlayingTitle.textContent = song.name;
                nowPlayingArtist.textContent = `${song.artistsname} · ${song.album}`;
                
                // 显示播放器
                playerContainer.classList.remove('hidden');
                
                // 显示加载状态
                nowPlayingCover.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                // 获取音乐链接
                const audioUrl = await getAudioUrl(song.id, currentQuality);
                
                // 设置音频源
                audioPlayer.src = audioUrl;
                
                // 更新专辑封面旋转状态
                nowPlayingCover.innerHTML = '<i class="fas fa-music"></i>';
                nowPlayingCover.classList.remove('playing');
                
                // 自动播放
                await audioPlayer.play();
                isPlaying = true;
                playIcon.className = 'fas fa-pause';
                nowPlayingCover.classList.add('playing');
                
                // 隐藏错误消息
                hideError();
                
            } catch (error) {
                showError('无法播放此歌曲，请尝试其他音质或歌曲');
                console.error('播放错误:', error);
            }
        }

        // 获取音频URL
        async function getAudioUrl(songId, quality) {
            try {
                // 调用音乐解析API
                const response = await fetch(`https://api.byfuns.top/1/?id=${songId}&level=${quality}`);
                
                if (!response.ok) {
                    throw new Error('获取音频链接失败');
                }
                
                // 获取音频URL
                const audioUrl = await response.text();
                
                if (!audioUrl || !audioUrl.startsWith('http')) {
                    throw new Error('无效的音频链接');
                }
                
                return audioUrl;
                
            } catch (error) {
                // 如果当前音质失败，尝试下一个较低音质
                const qualityOrder = ['hires', 'lossless', 'exhigh', 'higher', 'standard'];
                const currentIndex = qualityOrder.indexOf(quality);
                
                if (currentIndex < qualityOrder.length - 1) {
                    const nextQuality = qualityOrder[currentIndex + 1];
                    showError(`${qualityNames[quality]}获取失败，尝试${qualityNames[nextQuality]}...`);
                    return await getAudioUrl(songId, nextQuality);
                } else {
                    throw new Error('无法获取音频链接，请稍后再试');
                }
            }
        }

        // 下载歌曲
        async function downloadSong(song) {
            try {
                showError('正在准备下载，请稍候...');
                
                // 获取音频链接
                const audioUrl = await getAudioUrl(song.id, currentQuality);
                
                // 创建下载链接
                const a = document.createElement('a');
                a.href = audioUrl;
                
                // 根据音质设置文件扩展名
                let extension = 'mp3';
                if (currentQuality === 'hires' || currentQuality === 'lossless') {
                    extension = 'flac';
                }
                
                a.download = `${song.name} - ${song.artistsname}.${extension}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 显示下载成功提示
                showError(`下载已开始 (${qualityNames[currentQuality]})`);
                setTimeout(hideError, 2000);
                
            } catch (error) {
                showError('下载失败，请稍后再试');
                console.error('下载错误:', error);
            }
        }

        // 切换播放/暂停
        function togglePlayPause() {
            if (!audioPlayer.src) return;
            
            if (isPlaying) {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
                nowPlayingCover.classList.remove('playing');
            } else {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
                nowPlayingCover.classList.add('playing');
            }
            
            isPlaying = !isPlaying;
        }

        // 播放上一首
        function playPrev() {
            if (currentSongs.length === 0) return;
            
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = currentSongs.length - 1;
            
            const song = currentSongs[newIndex];
            playSong(song, newIndex);
        }

        // 播放下一首
        function playNext() {
            if (currentSongs.length === 0) return;
            
            let newIndex = currentIndex + 1;
            if (newIndex >= currentSongs.length) newIndex = 0;
            
            const song = currentSongs[newIndex];
            playSong(song, newIndex);
        }

        // 更新进度条
        function updateProgress() {
            if (!audioPlayer.duration) return;
            
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            // 更新当前时间
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        }

        // 更新总时长
        function updateDuration() {
            durationEl.textContent = formatTime(audioPlayer.duration);
        }

        // 格式化时间 (秒 -> 分:秒)
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        // 处理音频错误
        function handleAudioError() {
            showError('播放失败，请尝试其他音质或歌曲');
            isPlaying = false;
            playIcon.className = 'fas fa-play';
            nowPlayingCover.classList.remove('playing');
        }

        // 显示错误消息
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            
            // 5秒后自动隐藏
            setTimeout(hideError, 5000);
        }

        // 隐藏错误消息
        function hideError() {
            errorMessage.classList.remove('show');
        }

        // 初始化
        function init() {
            // 隐藏错误消息
            hideError();
            
            // 设置默认音质
            qualityButtons.forEach(btn => {
                if (btn.dataset.quality === currentQuality) {
                    btn.classList.add('active');
                }
            });
            
            // 添加触摸反馈
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                btn.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
            });
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
