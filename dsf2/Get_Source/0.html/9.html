    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        #search {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        .flags-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .flag-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .flag-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .flag-img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .country-name {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        .country-code {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>

        // 创建国旗卡片
        function createFlagCards() {
            const container = document.getElementById('flagsContainer');
            container.innerHTML = '';
            
            allCountries.forEach(country => {
                const card = document.createElement('div');
                card.className = 'flag-card';
                card.innerHTML = `
                    <img src="https://flagcdn.com/w320/${country.code}.png" 
                         alt="${country.name}国旗" 
                         class="flag-img"
                         onerror="this.src='https://flagcdn.com/w320/${country.code.toLowerCase()}.png'">
                    <div class="country-name">${country.name}</div>
                    <div class="country-code">${country.iso}</div>
                `;
                container.appendChild(card);
            });
        }

        // 搜索功能
        document.getElementById('search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.flag-card');
            
            cards.forEach(card => {
                const countryName = card.querySelector('.country-name').textContent.toLowerCase();
                if (countryName.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // 页面加载完成后创建国旗卡片
        document.addEventListener('DOMContentLoaded', createFlagCards);
