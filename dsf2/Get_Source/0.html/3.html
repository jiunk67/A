<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信零钱</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC","Helvetica Neue",sans-serif;
}
body{
  background:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
/* 上面内容 */
.content{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top: 100px;
}
.icon{
  width:68px;
  height:68px;
  background:#ffcc00;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}
.icon::after{
  content:"¥";
  font-size:34px;
  color:#fff;
  font-weight:bold;
}
.title{
  font-size:17px;
  color:#111;
  margin-bottom:12px;
}
.money{
  font-size:40px;
  font-weight:500;
  color:#000;
}

/* 底部按钮 */
.bottom{
  padding:20px 0 40px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.btn{
  width: 180px;
  padding: 11px 0;
  border-radius:6px;
  font-size:17px;
  border:none;
  outline:none;
}
.btn-green{
  background:#07c160;
  color:#fff;
}
.btn-gray{
  background:#f2f2f2;
  color:#333;
}
</style>
</head>
<body>

<div class="content">
  <div class="icon"></div>
  <div class="title">我的零钱</div>
  <div class="money">¥123456789</div>
</div>

<div class="bottom">
  <button class="btn btn-green">充值</button>
  <button class="btn btn-gray">提现</button>
</div>

</body>
</html>
