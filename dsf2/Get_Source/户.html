        body {

        }

        /* 头部区域 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #000;
            margin-right: 15px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* 状态栏 */
        .status-bar {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .status-text {
            font-size: 16px;
            color: #e53935;
        }

        .btn-get-code {
            padding: 8px 15px;
            border: 2px solid #e53935;
            background-color: #fff;
            color: #e53935;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-get-code:hover {
            background-color: #fef0f0;
        }

        /* 功能区标题 */
        .func-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        /* 功能按钮网格 */
        .func-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 功能按钮样式 */
        .func-btn {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
        }

        .func-btn:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        .func-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .icon-phone {
            background-color: #fce4ec;
            color: #e53935;
        }

        .icon-qq {
            background-color: #e3f2fd;
            color: #12b7f5;
        }

        .icon-tool {
            background-color: #e8f5e9;
            color: #4caf50;
        }

        .icon-ip {
            background-color: #fff3e0;
            color: #ff9800;
        }

        .icon-other {
            background-color: #f3e5f5;
            color: #9c27b0;
        }

        .func-text {
            font-size: 16px;
            color: #333;
            flex: 1;
        }

        /* 提示样式 */
        .tip {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
