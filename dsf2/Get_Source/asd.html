<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开心锤锤视频播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #333;
            --card-bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --primary-color: #4a6baf;
            --border-radius: 15px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #2a2a2a;
            --shadow-light: #3a3a3a;
            --shadow-dark: #1a1a1a;
            --primary-color: #6a8bcf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 10px;
            box-shadow: 8px 8px 15px var(--shadow-dark), -8px -8px 15px var(--shadow-light);
            margin-bottom: 30px;
        }
        
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 8px;
            background-color: var(--shadow-dark);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            border-radius: 4px;
        }

        .time-display {
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-select {
            padding: 8px 12px;
            border-radius: var(--border-radius);
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
            outline: none;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .floating-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        .floating-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--text-color);
            font-size: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .floating-button:hover {
            transform: scale(1.1);
        }

        .scroll-to-top {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
    </style>
    <style>
    .video-container {
        width: 100%;
        margin-bottom: 20px;
        border-radius: var(--border-radius);
        overflow: hidden;
        position: relative;
        background-color: transparent; 
        aspect-ratio: 1 / 1.5;
    }
    .video-player {
        width: 100%;
        height: 100%;
        object-fit: cover; 
        display: block;
        opacity: 0.9;
    }
    .loading {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(224, 229, 236, 0.7);
        color: var(--text-color);
        flex-direction: column;
        gap: 15px;
        display: none;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
        </div>
        <div class="video-card">
            <div class="video-container">
                <video id="videoPlayer" class="video-player" controlsList="nodownload nofullscreen noremoteplayback" disablePictureInPicture></video>
                <div class="loading" id="videoLoading">
                    <div class="spinner"></div>
                    <p>正在加载视频...</p>
                </div>
            </div>
            <div class="error-message" id="errorMessage">
                视频加载失败，正在尝试重新加载...
            </div>
            <div class="controls-container">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                </div>
                <div class="speed-control">
                    <label for="playbackSpeed">播放速度:</label>
                    <select id="playbackSpeed" class="speed-select">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x (正常)</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
            </div>
            <div class="action-buttons">
                <button id="randomBtn" class="action-btn">
                    <i class="fas fa-random"></i> 随机视频
                </button>
            </div>
        </div>
    </div>

    <div class="floating-buttons">
        <button class="floating-button theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
        <button class="floating-button scroll-to-top" id="scrollToTop">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        });
        const scrollToTop = document.getElementById('scrollToTop');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                scrollToTop.classList.add('visible');
            } else {
                scrollToTop.classList.remove('visible');
            }
        });
        scrollToTop.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        const videoPlayer = document.getElementById('videoPlayer');
        const randomBtn = document.getElementById('randomBtn');
        const videoLoading = document.getElementById('videoLoading');
        const errorMessage = document.getElementById('errorMessage');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const playbackSpeed = document.getElementById('playbackSpeed');
        let loadTimeout;
        const MAX_LOAD_TIME = 10000; 
        function initPlayer() {
            videoPlayer.controls = false;
            videoPlayer.playbackRate = playbackSpeed.value;
            loadRandomVideo();
        }
        function loadRandomVideo() {
            videoLoading.style.display = 'flex';
            errorMessage.style.display = 'none';
            videoPlayer.src = '';
            loadTimeout = setTimeout(() => {
                if (!videoPlayer.src || videoPlayer.readyState < 3) {
                    showError();
                }
            }, MAX_LOAD_TIME);
            const apiUrl = 'http://api.corexwear.com/kxcc/index.php';
            const timestamp = new Date().getTime(); 
            videoPlayer.src = `${apiUrl}?t=${timestamp}`;
            videoPlayer.load();
        }
        function showError() {
            clearTimeout(loadTimeout);
            videoLoading.style.display = 'none';
            errorMessage.style.display = 'block';
            setTimeout(loadRandomVideo, 3000);
        }
        function updateProgress() {
            if (!isNaN(videoPlayer.duration) && isFinite(videoPlayer.duration)) {
                const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
                progressFill.style.width = `${percent}%`;
                const currentTime = formatTime(videoPlayer.currentTime);
                const duration = formatTime(videoPlayer.duration);
                timeDisplay.textContent = `${currentTime} / ${duration}`;
            }
        }
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        videoPlayer.addEventListener('loadeddata', () => {
            clearTimeout(loadTimeout);
            videoLoading.style.display = 'none';
            videoPlayer.play().catch(e => {
                console.log('自动播放被阻止:', e);
            });
        });
        videoPlayer.addEventListener('error', () => {
            showError();
        });
        videoPlayer.addEventListener('timeupdate', updateProgress);
        randomBtn.addEventListener('click', loadRandomVideo);
        playbackSpeed.addEventListener('change', () => {
            videoPlayer.playbackRate = playbackSpeed.value;
        });
        progressFill.parentElement.addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            videoPlayer.currentTime = pos * videoPlayer.duration;
        });
        initPlayer();
    </script>
</body>
</html>
