<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>颜色代码提取器</title>
<style>
:root{
    --bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    --glass:rgba(255,255,255,.15);
    --text:#fff;
    --radius:24px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:var(--font);
    background:var(--bg);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
}
.card{
    width:100%;
    max-width:320px;
    backdrop-filter:blur(18px);
    background:var(--glass);
    border:1px solid rgba(255,255,255,.2);
    border-radius:var(--radius);
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    animation:fadeIn .6s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
h1{text-align:center;margin-bottom:25px;font-size:24px}
input[type=color]{
    width:100%;
    height:120px;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:transform .3s;
}
input[type=color]:hover{transform:scale(1.05)}
.code{
    margin-top:20px;
    padding:12px 16px;
    background:rgba(0,0,0,.15);
    border-radius:var(--radius);
    font-family:monospace;
    font-size:18px;
    text-align:center;
    user-select:all;
}
.copy-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:var(--radius);
    background:#22c55e;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:transform .3s;
}
.copy-btn:hover{transform:scale(1.03)}
</style>
</head>
<body>
<div class="card">
    <h1>颜色代码提取器</h1>
    <input type="color" id="colorPicker" value="#667eea">
    <div class="code" id="colorCode">#667eea</div>
    <button class="copy-btn" onclick="copyCode()">复制代码</button>
</div>

<script>
const picker=document.getElementById('colorPicker');
const code=document.getElementById('colorCode');

picker.addEventListener('input',()=>{
    code.textContent=picker.value;
});

function copyCode(){
    navigator.clipboard.writeText(code.textContent);
    // 轻微反馈动画
    document.querySelector('.copy-btn').textContent='已复制！';
    setTimeout(()=>document.querySelector('.copy-btn').textContent='复制代码',1200);
}
</script>
</body>
</html>
