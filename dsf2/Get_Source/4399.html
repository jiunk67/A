<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4399小白号生成器 - 免费账号一键生成</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 30px;
            margin: 20px auto;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #e0e0e0;
        }

        .logo {
            font-size: 2.8rem;
            color: #2575fc;
            margin-bottom: 10px;
        }

        h1 {
            color: #2d3436;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.1rem;
        }

        .account-card {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 8px solid #6a11cb;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .info-label {
            font-weight: 700;
            color: #495057;
            min-width: 120px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .info-label i {
            margin-right: 10px;
            color: #6a11cb;
            width: 24px;
        }

        .info-value {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d3436;
            word-break: break-all;
            padding: 8px 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #ced4da;
        }

        .copy-btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 100px;
        }

        .copy-btn:hover {
            background-color: #00a085;
            transform: translateY(-2px);
        }

        .copy-btn i {
            margin-right: 8px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .primary-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(37, 117, 252, 0.4);
        }

        .primary-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(37, 117, 252, 0.6);
        }

        .secondary-btn {
            background-color: #dfe6e9;
            color: #2d3436;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secondary-btn:hover {
            background-color: #b2bec3;
            transform: translateY(-3px);
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            max-width: 800px;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #2575fc;
        }

        .feature i {
            font-size: 2.5rem;
            color: #6a11cb;
            margin-bottom: 15px;
        }

        .feature h3 {
            color: #2d3436;
            margin-bottom: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .logo {
                font-size: 2.2rem;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-label {
                min-width: auto;
                margin-bottom: 8px;
            }

            .info-value {
                width: 100%;
                font-size: 1.1rem;
            }

            .copy-btn {
                margin-left: 0;
                margin-top: 12px;
                width: 100%;
            }

            .btn-container {
                flex-direction: column;
            }

            .primary-btn, .secondary-btn {
                width: 100%;
                padding: 16px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .account-card {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-gamepad"></i>
            </div>
            <h1>4399小白号生成器</h1>
            <p class="subtitle">一键生成随机游戏账号 | 完全免费 | 自适应所有设备</p>
        </header>

        <main>
            <div class="account-card">
                <div class="info-row">
                    <div class="info-label">
                        <i class="fas fa-user"></i> 生成账号
                    </div>
                    <div id="generatedUsername" class="info-value">点击下方按钮生成</div>
                    <button class="copy-btn" onclick="copyToClipboard('generatedUsername')">
                        <i class="far fa-copy"></i> 复制
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-label">
                        <i class="fas fa-key"></i> 生成密码
                    </div>
                    <div id="generatedPassword" class="info-value">点击下方按钮生成</div>
                    <button class="copy-btn" onclick="copyToClipboard('generatedPassword')">
                        <i class="far fa-copy"></i> 复制
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-label">
                        <i class="fas fa-id-card"></i> 模拟昵称
                    </div>
                    <div id="generatedNickname" class="info-value">点击下方按钮生成</div>
                    <button class="copy-btn" onclick="copyToClipboard('generatedNickname')">
                        <i class="far fa-copy"></i> 复制
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-label">
                        <i class="fas fa-birthday-cake"></i> 注册时间
                    </div>
                    <div id="generatedRegDate" class="info-value">点击下方按钮生成</div>
                </div>
            </div>

            <div class="btn-container">
                <button class="primary-btn" onclick="generateNewAccount()">
                    <i class="fas fa-bolt"></i> 一键生成小白号
                </button>
                <button class="secondary-btn" onclick="generateBatch()">
                    <i class="fas fa-layer-group"></i> 批量生成(5个)
                </button>
            </div>

            <div class="features">
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>全设备适配</h3>
                    <p>完美适配手机、平板、电脑屏幕，随时随地生成账号。</p>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <h3>本地生成</h3>
                    <p>完全在浏览器中运行，无需网络传输，保护隐私。</p>
                </div>
                <div class="feature">
                    <i class="fas fa-infinity"></i>
                    <h3>永久免费</h3>
                    <p>无任何收费计划，所有功能完全免费使用。</p>
                </div>
            </div>
        </main>
    </div>

    <div class="footer-note">
        <p>本工具生成的账号信息仅为随机模拟数据，可用于测试、演示等用途。请遵守相关平台的服务条款。</p>
        <p>© 2023 4399小白号生成器 | 设计独创，与网上现有源码不重复</p>
    </div>

    <script>
        // 随机数据池
        const firstNameParts = ['炫酷', '无敌', '萌萌', '战神', '幽灵', '闪电', '烈焰', '冰雪', '星空', '霸王'];
        const lastNameParts = ['小王', '小龙', '小虎', '猎人', '法师', '刺客', '射手', '骑士', '熊猫', '狐狸'];
        const adjectives = ['快乐的', '愤怒的', '安静的', '狂奔的', '飞翔的', '沉睡的', '智慧的', '勇敢的'];
        const nouns = ['熊猫', '巨龙', '忍者', '巫师', '海盗', '骑士', '精灵', '怪兽'];

        // 生成随机用户名（模拟4399格式）
        function generateUsername() {
            const prefixes = ['game', 'player', 'xiaobai', 'game', 'user', 'test'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const numbers = Math.floor(100000 + Math.random() * 900000); // 6位随机数
            return prefix + numbers;
        }

        // 生成随机密码
        function generatePassword() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
            let password = '';
            const length = 10 + Math.floor(Math.random() * 6); // 10-15位长度
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        // 生成随机昵称
        function generateNickname() {
            const firstName = firstNameParts[Math.floor(Math.random() * firstNameParts.length)];
            const lastName = lastNameParts[Math.floor(Math.random() * lastNameParts.length)];
            return firstName + lastName;
        }

        // 生成随机游戏昵称（另一种风格）
        function generateGameNickname() {
            const adjective = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            return adjective + noun;
        }

        // 生成随机注册日期（最近3年内的随机日期）
        function generateRegDate() {
            const now = new Date();
            const threeYearsAgo = new Date(now.getFullYear() - 3, now.getMonth(), now.getDate());
            const randomTime = threeYearsAgo.getTime() + Math.random() * (now.getTime() - threeYearsAgo.getTime());
            const randomDate = new Date(randomTime);
            return randomDate.getFullYear() + '-' + 
                   String(randomDate.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(randomDate.getDate()).padStart(2, '0') + ' ' +
                   String(randomDate.getHours()).padStart(2, '0') + ':' + 
                   String(randomDate.getMinutes()).padStart(2, '0');
        }

        // 生成新账号
        function generateNewAccount() {
            // 随机选择一种昵称生成方式
            const nicknameType = Math.random() > 0.5 ? 'chinese' : 'game';
            const nickname = nicknameType === 'chinese' ? generateNickname() : generateGameNickname();
            
            document.getElementById('generatedUsername').textContent = generateUsername();
            document.getElementById('generatedPassword').textContent = generatePassword();
            document.getElementById('generatedNickname').textContent = nickname;
            document.getElementById('generatedRegDate').textContent = generateRegDate();
        }

        // 批量生成账号
        function generateBatch() {
            let batchOutput = "批量生成的4399小白号 (5个)：\n\n";
            for (let i = 0; i < 5; i++) {
                const nicknameType = Math.random() > 0.5 ? 'chinese' : 'game';
                const nickname = nicknameType === 'chinese' ? generateNickname() : generateGameNickname();
                
                batchOutput += `账号 ${i+1}:\n`;
                batchOutput += `用户名: ${generateUsername()}\n`;
                batchOutput += `密码: ${generatePassword()}\n`;
                batchOutput += `昵称: ${nickname}\n`;
                batchOutput += `注册时间: ${generateRegDate()}\n`;
                batchOutput += "─".repeat(30) + "\n";
            }
            
            // 显示在第一个信息框中，用户可以复制全部
            document.getElementById('generatedUsername').textContent = "批量生成完成！";
            document.getElementById('generatedPassword').textContent = "共5组账号已就绪";
            document.getElementById('generatedNickname').innerHTML = `<textarea id="batchOutput" style="width:100%; height:120px; font-family:monospace; padding:10px;">${batchOutput}</textarea>`;
            document.getElementById('generatedRegDate').textContent = "可复制上方文本框内的全部内容";
        }

        // 复制到剪贴板
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            let textToCopy = '';
            
            if (elementId === 'generatedNickname' && document.getElementById('batchOutput')) {
                // 如果是批量生成的结果
                const textarea = document.getElementById('batchOutput');
                textarea.select();
                textToCopy = textarea.value;
            } else {
                textToCopy = element.textContent || element.innerText;
            }
            
            // 使用现代剪贴板API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('已复制到剪贴板！');
                }, (err) => {
                    // 如果现代API失败，使用传统方法
                    fallbackCopyTextToClipboard(textToCopy);
                });
            } else {
                // 使用传统方法
                fallbackCopyTextToClipboard(textToCopy);
            }
        }

        // 传统复制方法
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请手动选择文本进行复制。');
            }
            document.body.removeChild(textArea);
        }

        // 页面加载时自动生成一个账号
        window.onload = generateNewAccount;
    </script>
</body>
</html>
