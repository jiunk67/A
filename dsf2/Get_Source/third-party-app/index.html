<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>应用启动中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            background: #f5f5f5;
        }

        /* 背景图 */
        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 10;
        }

        .top-btn {
            padding: 8px 16px;
            background-color: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.3s ease;
            text-align: center;
            min-width: 80px;
        }

        .top-btn:hover,
        .top-btn:active {
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* 底部卡片 */
        .bottom-card {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 140px;
            background: #fff;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            display: flex;
            align-items: center;
            z-index: 5;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(100%);
            animation: slideUp 0.6s 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .bottom-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0.8);
            animation: iconPop 0.4s 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .bottom-card-icon img {
            width: 32px;
            height: 32px;
        }

        .bottom-card-content {
            flex: 1;
            min-width: 0;
            opacity: 0;
            transform: translateX(-10px);
            animation: contentSlide 0.5s 0.7s ease-out forwards;
        }

        .bottom-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .bottom-card-subtitle {
            font-size: 15px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        @keyframes iconPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes contentSlide {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- 全屏背景图 -->
    <img class="bg" src="Screenshot_2025_0814_021643.png" alt="背景">

    <!-- 顶部按钮区域 -->
    <div class="top-buttons">

        <a href="xh.html" class="top-btn" id="skipBtn">跳过 5s</a>
    </div>

    <!-- 底部卡片 -->
    <div class="bottom-card">
        <div class="bottom-card-icon">
            <img src="jkx.jpeg" alt="图标">
        </div>
        <div class="bottom-card-content">
            <div class="bottom-card-title">极客匣 · 超级工具箱</div>
            <div class="bottom-card-subtitle">探索无限可能</div>
        </div>
    </div>

    <script>
        const skipBtn = document.getElementById('skipBtn');
        
        let countdown = 5; // 已改为5秒
        let timer = null;
        
        // 启动倒计时
        function startCountdown() {
            timer = setInterval(() => {
                countdown--;
                skipBtn.textContent = `跳过 ${countdown}s`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    window.location.href = "xh.html";
                }
            }, 1000);
        }
        
        // 初始化倒计时
        startCountdown();

        skipBtn.addEventListener('click', () => {
            clearInterval(timer);
        });

      

        // 禁止手势缩放
        document.addEventListener('gesturestart', e => e.preventDefault());
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd <= 500) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>
