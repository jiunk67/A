    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 12px;           /* 圆角大小 */
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);padding-top:72px}
    .container{max-width:1200px;margin:0 auto;padding:0 20px 30px}

    /* 搜索框固定圆角加宽 */
    .header{
      position:fixed;top:0;left:0;right:0;z-index:999;
      background:var(--bg);padding:12px 0;
      display:flex;justify-content:center;align-items:center;
    }
    .search-box{width:100%;max-width:520px;padding:0 20px}
    .search-input{
      width:100%;height:50px;padding:0 20px;
      font-size:1rem;border:1px solid var(--muted);
      border-radius:var(--radius);outline:none;
      transition:.25s;background:var(--card);
    }
    .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(102,126,234,.15)}
    @media(max-width:600px){.search-box{max-width:90%}.grid{grid-template-columns:1fr}}

    /* 其余样式不变 */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 12px 0 rgba(0,0,0,.06);padding:24px;cursor:pointer;transition:.3s}
    .card:hover{transform:translateY(-6px);box-shadow:0 12px 28px 0 rgba(0,0,0,.1)}
    .name{font-weight:600;font-size:1.1rem;margin-bottom:6px}
    .desc{font-size:.9rem;color:var(--muted);line-height:1.4}
    .star{position:absolute;top:8px;right:8px;font-size:1.2rem;color:#ccc;cursor:pointer}
    .star.active{color:#f59e0b}
    .back{position:fixed;bottom:24px;right:24px;width:52px;height:52px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;cursor:pointer;transition:.25s}
    .back:hover{transform:scale(1.1)}
  </style>
</head>

    let collections = JSON.parse(localStorage.getItem('collections') || '[]');

    function render(list) {
      const grid = document.getElementById('grid');
      grid.innerHTML = list.map(r => {
        const isStarred = collections.some(c => c.url === r.url);
        return `
          <div class="card" onclick="window.open('${r.url}', '_blank')">
            <div class="star ${isStarred ? 'active' : ''}" onclick="toggle(event, '${r.url}')">★</div>
            <div class="name">${r.name}</div>
            <div class="desc">${r.desc}</div>
          </div>
        `;
      }).join('');
    }

    function toggle(e, url) {
      e.stopPropagation();
      const idx = collections.findIndex(c => c.url === url);
      idx > -1 ? collections.splice(idx, 1) : collections.push(links.find(l => l.url === url));
      localStorage.setItem('collections', JSON.stringify(collections));
      render(links);
    }

    function search(keyword) {
      const filtered = links.filter(item =>
        item.name.toLowerCase().includes(keyword.toLowerCase()) ||
        item.desc.toLowerCase().includes(keyword.toLowerCase())
      );
      render(filtered);
    }

    render(links);
  </script>
