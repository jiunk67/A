<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件发送系统</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            color: #4a6cf7;
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: flex;
            align-items: center;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        label i {
            margin-right: 8px;
            font-size: 16px;
            color: #718096;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 10px;
            font-size: 14px;
            color: #2d3748;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #4a6cf7;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a6cf7 0%, #3a56d4 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn i {
            margin-right: 8px;
            font-size: 18px;
        }
        
        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background: rgba(72, 187, 120, 0.1);
            color: #38a169;
            border: 1px solid rgba(72, 187, 120, 0.2);
        }
        
        .error {
            background: rgba(245, 101, 101, 0.1);
            color: #e53e3e;
            border: 1px solid rgba(245, 101, 101, 0.2);
        }
        
        .loading {
            background: rgba(66, 153, 225, 0.1);
            color: #3182ce;
            border: 1px solid rgba(66, 153, 225, 0.2);
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #718096;
            font-size: 13px;
        }
        
        .api-info {
            background: rgba(247, 250, 252, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #4a5568;
        }
        
        .api-info i {
            color: #4a6cf7;
            margin-right: 6px;
        }
        
        .retry-btn {
            background: #ed8936;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .retry-btn:hover {
            background: #dd6b20;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="ri-mail-send-line"></i>
            </div>
            <h1>邮件发送系统</h1>
        </div>
        
        <div class="api-info">
            <i class="ri-link"></i>
            <strong>API地址：</strong> http://xiaoxun.my/api/v1/email.php
        </div>
        
        <form id="emailForm">
            <div class="form-group">
                <label for="fromEmail">
                    <i class="ri-user-line"></i> 发件邮箱
                </label>
                <input type="email" id="fromEmail" placeholder="请输入发件人QQ邮箱" required>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="ri-key-line"></i> 授权码
                </label>
                <input type="password" id="password" placeholder="请输入QQ邮箱授权码" required>
            </div>
            
            <div class="form-group">
                <label for="fromName">
                    <i class="ri-user-3-line"></i> 发件人名称 (可选)
                </label>
                <input type="text" id="fromName" placeholder="请输入发件人名称">
            </div>
            
            <div class="form-group">
                <label for="toEmail">
                    <i class="ri-mail-line"></i> 收件邮箱
                </label>
                <input type="email" id="toEmail" placeholder="请输入收件人邮箱地址" required>
            </div>
            
            <div class="form-group">
                <label for="subject">
                    <i class="ri-subtract-line"></i> 邮件主题
                </label>
                <input type="text" id="subject" placeholder="请输入邮件主题" required>
            </div>
            
            <div class="form-group">
                <label for="body">
                    <i class="ri-file-text-line"></i> 邮件正文
                </label>
                <textarea id="body" placeholder="请输入邮件正文内容" required></textarea>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="isHTML">
                <label for="isHTML">
                    <i class="ri-code-s-slash-line"></i> 包含HTML格式
                </label>
            </div>
            
            <div class="form-group" id="altBodyContainer" style="display: none;">
                <label for="altBody">
                    <i class="ri-text"></i> 纯文本内容 (可选，当包含HTML时使用)
                </label>
                <textarea id="altBody" placeholder="为不支持HTML的邮件客户端提供纯文本内容"></textarea>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                <i class="ri-send-plane-fill"></i> 发送邮件
            </button>
        </form>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="footer">
            <p>使用QQ邮箱SMTP服务发送邮件</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('emailForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            const isHTMLCheckbox = document.getElementById('isHTML');
            const altBodyContainer = document.getElementById('altBodyContainer');
            const apiUrl = 'http://xiaoxun.my/api/v1/email.php';
            
            // 存储最后一次提交的数据，用于重试
            let lastFormData = null;
            
            // 显示/隐藏纯文本内容输入框
            isHTMLCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    altBodyContainer.style.display = 'block';
                } else {
                    altBodyContainer.style.display = 'none';
                }
            });
            
            // 表单提交处理
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // 收集表单数据
                const formData = {
                    fromEmail: document.getElementById('fromEmail').value.trim(),
                    password: document.getElementById('password').value.trim(),
                    fromName: document.getElementById('fromName').value.trim(),
                    toEmail: document.getElementById('toEmail').value.trim(),
                    subject: document.getElementById('subject').value.trim(),
                    body: document.getElementById('body').value.trim(),
                    isHTML: isHTMLCheckbox.checked ? 'true' : 'false',
                    altBody: document.getElementById('altBody').value.trim()
                };
                
                // 保存最后一次提交的数据
                lastFormData = formData;
                
                // 验证必填字段
                if (!formData.fromEmail || !formData.password || !formData.toEmail || 
                    !formData.subject || !formData.body) {
                    showMessage('请填写所有必填字段', 'error');
                    return;
                }
                
                // 验证邮箱格式
                if (!validateEmail(formData.fromEmail) || !validateEmail(formData.toEmail)) {
                    showMessage('请输入有效的邮箱地址', 'error');
                    return;
                }
                
                // 如果没有填写发件人名称，使用默认值
                if (!formData.fromName) {
                    formData.fromName = '邮件发送者';
                }
                
                // 发送邮件
                await sendEmailRequest(formData);
            });
            
            // 发送邮件请求函数
            async function sendEmailRequest(formData) {
                // 禁用提交按钮，防止重复提交
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="ri-loader-4-line"></i> 发送中...';
                
                // 显示发送中状态
                showMessage('正在发送邮件，请稍候...', 'loading');
                
                try {
                    // 发送请求到API - 添加超时处理
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams(formData),
                        signal: controller.signal,
                        mode: 'cors' // 明确指定CORS模式
                    });
                    
                    clearTimeout(timeoutId);
                    
                    // 检查响应状态
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status} ${response.statusText}`);
                    }
                    
                    // 尝试解析JSON响应
                    let result;
                    try {
                        const text = await response.text();
                        result = text ? JSON.parse(text) : { success: false, message: '服务器返回空响应' };
                    } catch (parseError) {
                        console.warn('响应不是有效的JSON:', parseError);
                        // 即使JSON解析失败，邮件可能已经发送成功
                        result = { 
                            success: false, 
                            message: '服务器响应格式错误，但邮件可能已发送成功，请检查收件箱' 
                        };
                    }
                    
                    if (result.success) {
                        showMessage(`邮件发送成功！收件人：${result.data.to}`, 'success');
                        // 清空表单
                        form.reset();
                        altBodyContainer.style.display = 'none';
                        lastFormData = null; // 清空重试数据
                    } else {
                        // 显示服务器返回的错误信息
                        showMessage(`发送失败：${result.message}`, 'error');
                        
                        // 添加重试按钮
                        addRetryButton();
                    }
                    
                } catch (error) {
                    console.error('发送请求时出错:', error);
                    
                    // 根据错误类型显示不同的消息
                    let errorMessage;
                    if (error.name === 'AbortError') {
                        errorMessage = '请求超时（30秒），请检查网络连接或稍后重试';
                    } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        errorMessage = '网络连接失败，但邮件可能已发送，请稍后检查收件箱';
                    } else {
                        errorMessage = `请求错误：${error.message}`;
                    }
                    
                    showMessage(`${errorMessage}。如果邮件已成功发送，您应该能在收件箱中看到。`, 'error');
                    
                    // 添加重试按钮
                    addRetryButton();
                } finally {
                    // 恢复提交按钮
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="ri-send-plane-fill"></i> 发送邮件';
                }
            }
            
            // 添加重试按钮
            function addRetryButton() {
                // 移除已存在的重试按钮
                const existingRetryBtn = document.getElementById('retryBtn');
                if (existingRetryBtn) {
                    existingRetryBtn.remove();
                }
                
                // 添加新的重试按钮
                if (lastFormData) {
                    const retryBtn = document.createElement('button');
                    retryBtn.id = 'retryBtn';
                    retryBtn.className = 'retry-btn';
                    retryBtn.innerHTML = '<i class="ri-refresh-line"></i> 重试';
                    retryBtn.onclick = async () => {
                        await sendEmailRequest(lastFormData);
                    };
                    
                    statusMessage.appendChild(retryBtn);
                }
            }
            
            // 显示状态消息
            function showMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message ${type}`;
                statusMessage.style.display = 'block';
                
                // 自动隐藏成功消息
                if (type === 'success') {
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, 5000);
                }
            }
            
            // 邮箱格式验证
            function validateEmail(email) {
                const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            }
            
            // 添加测试数据按钮（仅用于开发测试）
            function addTestDataButton() {
                const testBtn = document.createElement('button');
                testBtn.className = 'retry-btn';
                testBtn.style.marginTop = '10px';
                testBtn.innerHTML = '<i class="ri-test-tube-line"></i> 填充测试数据';
                testBtn.onclick = () => {
                    document.getElementById('fromEmail').value = 'test@qq.com';
                    document.getElementById('password').value = 'test123';
                    document.getElementById('fromName').value = '测试用户';
                    document.getElementById('toEmail').value = 'recipient@example.com';
                    document.getElementById('subject').value = '测试邮件主题';
                    document.getElementById('body').value = '这是一封测试邮件内容\n换行测试\n\n结束。';
                };
                
                document.querySelector('.footer').appendChild(testBtn);
            }
            
            // 取消注释下面这行可以添加测试数据按钮（方便开发测试）
            // addTestDataButton();
        });
    </script>
</body>
</html>
