<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>像素画</title>
</head>
<body>
<style>
*{
  margin:0;
  padding:0;
  }
html{
  width:100vw;
  height:100vh;
  background-color:black;
  }
body{
  width:100%;
  height:100%;
  }
#Canvas{
  top:0;
  left:0;
  z-index:-1;
  position:fixed;
  }
button{
  width:80%;
  height:40px;
  border:none;
  outline:none;
  color:#0066ff;
  position:fixed;
  font-size:20px;
  margin-top:50px;
  margin-left:10%;
  border-radius:2.5px;
  outline:2px solid #0066ff;
  background-color:Transparent;
  filter:drop-shadow(0 0 0.3px #000);
  }
</style>
<input type="file" id="inputFile" style="display:none;" accept="image/*">
<canvas id="Canvas"></canvas>
<button id="selectFile" style="bottom:25%;">选取图片</button>
<button id="Download" style="  bottom:15%;">下载图片</button>
<script>
const canvas = document.getElementById("Canvas");
const download = document.getElementById("Download");
const dpr = devicePixelRatio;
const ww = window.innerWidth;
const wh = window.innerHeight;
const ctx = canvas.getContext('2d');

function pointIindexColor(x,y){
if(x < 0 || x >= imgWidth || y < 0 || y >= imgHeight)return;
const index = (x + y * imgWidth) * 4;
const r = imgData[index];
const g = imgData[index + 1];
const b = imgData[index + 2];
const a = imgData[index + 3];
return [r,g,b,a];
}

var imgData,imgWidth,imgHeight;
class Pixel{
 constructor(x,y,gap){
  this.x = x;
  this.y = y;
  this.gap = gap;
  this.size = gap * dpr;
  this.tss = this.size / 8 * dpr;
  this.color = pointIindexColor(this.x,this.y);
 }
 draw(){
  ctx.beginPath();
  ctx.fillStyle = `rgba(${this.color})`;
  ctx.fillRect(this.x * dpr, this.y * dpr, this.size, this.size);
  
  this.borderTop();
  this.borderLeft();
  this.borderRight();
  this.borderBottom();
 }
 borderTop(){
  const x = this.x * dpr;
  const y = this.y * dpr;
  const color = pointIindexColor(this.x,this.y - this.gap);
  if(!color)return;
  let value = (this.color[0] - color[0] + this.color[1] - color[1] + this.color[2] - color[2] + this.color[3] - color[3]) / 765;
  let shadow;
  if(value > 0){
  shadow = [255,255,255,value];
  }else if(value < 0){
  value = - value;
  shadow = [0,0,0,value];
  }
  const tss = this.tss * value;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x + tss,y + tss);
  ctx.lineTo(x + this.size - tss,y + tss);
  ctx.lineTo(x + this.size,y);
  ctx.closePath();
  ctx.fillStyle = `rgba(${shadow})`;
  ctx.fill();
 }
 borderBottom(){
  const x = this.x * dpr;
  const y = this.y * dpr;
  const color = pointIindexColor(this.x,this.y + this.gap);
  if(!color)return;
  let value = (this.color[0] - color[0] + this.color[1] - color[1] + this.color[2] - color[2] + this.color[3] - color[3]) / 765;
  let shadow;
  if(value > 0){
  shadow = [255,255,255,value];
  }else if(value < 0){
  value = - value;
  shadow = [0,0,0,value];
  }
  const tss = this.tss * value;
  ctx.beginPath();
  ctx.moveTo(x,y + this.size);
  ctx.lineTo(x + tss,y + this.size - tss);
  ctx.lineTo(x + this.size - tss,y + this.size - tss);
  ctx.lineTo(x + this.size,y + this.size);
  ctx.closePath();
  ctx.fillStyle = `rgba(${shadow})`;
  ctx.fill();
 }
 borderLeft(){
  const x = this.x * dpr;
  const y = this.y * dpr;
  const color = pointIindexColor(this.x - this.gap,this.y);
  if(!color)return;
  let value = (this.color[0] - color[0] + this.color[1] - color[1] + this.color[2] - color[2] + this.color[3] - color[3]) / 765;
  let shadow;
  if(value > 0){
  shadow = [255,255,255,value];
  }else if(value < 0){
  value = - value;
  shadow = [0,0,0,value];
  }
  const tss = this.tss * value;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x + tss,y + tss);
  ctx.lineTo(x + tss,y + this.size - tss);
  ctx.lineTo(x,y + this.size);
  ctx.closePath();
  ctx.fillStyle = `rgba(${shadow})`;
  ctx.fill();
 }
 borderRight(){
  const x = this.x * dpr;
  const y = this.y * dpr;
  const color = pointIindexColor(this.x  + this.gap,this.y);
  if(!color)return;
  let value = (this.color[0] - color[0] + this.color[1] - color[1] + this.color[2] - color[2] + this.color[3] - color[3]) / 765;
  let shadow;
  if(value > 0){
  shadow = [255,255,255,value];
  }else if(value < 0){
  value = - value;
  shadow = [0,0,0,value];
  }
  const tss = this.tss * value;
  ctx.beginPath();
  ctx.moveTo(x + this.size,y);
  ctx.lineTo(x + this.size - tss,y + tss);
  ctx.lineTo(x + this.size - tss,y + this.size - tss);
  ctx.lineTo(x + this.size,y + this.size);
  ctx.closePath();
  ctx.fillStyle = `rgba(${shadow})`;
  ctx.fill();
 }
}

function Handle(img,gap){
return new Promise((resolve,reject) => {
    try{
     const canvas = document.createElement("canvas");
     canvas.width = img.width;
     canvas.height = img.height;
     imgWidth = img.width;
     imgHeight = img.height;
     const cvs = canvas.getContext('2d');
     cvs.drawImage(img,0,0);
     imgData = cvs.getImageData(0,0,img.width,img.height).data;
     var arr = [];
     for(let i = 0; i < img.width; i += gap){
      for(let j = 0; j < img.height; j += gap){
        arr.push(new Pixel(i,j,gap));
       }
      }
     resolve(arr);
    }catch(error){
     reject(error);
    }
  });
}

function Processing(data){
 const image = new Image();
 image.src = data;
 image.onload = function (){
 if(this.width + this.height <= 5500){
  canvas.width = this.width * dpr;
  canvas.height = this.height * dpr;
  canvas.style.width = ww + "px";
  canvas.style.height = this.height * (ww / this.width) + "px";
  const sparse = + window.prompt("请输入像素稀疏度\n 提示:输入的数字越小处理时间也就越长");
  if(!sparse || sparse <= 1 ){
   ctx.drawImage(this,0,0,this.width * dpr,this.height * dpr);
  }else{
   const lastTime = Date.now();
   Handle(this,sparse).then(result=>{
    result.forEach((p)=>{
    p.draw();
   });
    const time = (Date.now() - lastTime) / 1000 + "s";
    alert("耗时" + time);
   }).catch(error=>{
    alert(error);
   });
  }
  }else{
  alert("图片太大了，另选一张吧！");
  }
 }
}

//选取图片文件
selectFile.onclick = function (){
  const inputFile = document.getElementById("inputFile");
  inputFile.click();
  inputFile.onchange = function(e){
   const file = this.files[0];if(file){
    if(file.type.split(/[/]/)[0] === "image"){
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = e =>{
    const data = e.target.result;
    Processing(data);
    }
   }else{
   alert("只能选取图片！！！");
   }
  }else{
  //选取文件已取消
  }
 }
}

download.onclick = function (){
 const imageType = "image/png";
 const imgURL = canvas.toDataURL(imageType);
 const Link = document.createElement('a');
 Link.download = "pixel.png";
 Link.href = imgURL;
 Link.dataset.downloadurl = [imageType, Link.download, Link.href].join(':');
 document.body.appendChild(Link);
 Link.click();
 document.body.removeChild(Link);
 }
</script>
</body>
</html>
