<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
  color: #333;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}
.features {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 2rem;
}
.feature-card {
  background-color: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 0.5rem;
  padding: 1rem;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06);
  width: 100%;
  max-width: 300px;
  text-align: center;
}
.feature-card h3 {
  font-size: 1.25rem;
  color: #2d3748;
  margin-bottom: 0.5rem;
}
.feature-card p {
  font-size: 1rem;
  color: #666;
}
.sponsor-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 每行两个按钮 */
  gap: 1rem;
}
.sponsor-card {
  background-color: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 0.5rem;
  padding: 1rem;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06);
  width: 100%; /* 设置固定的宽度 */
  height: 100px; /* 设置固定的高度 */
  display: flex;
  align-items: center;
  justify-content: center;
}
.sponsor-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}
.sponsor-name {
  font-size: 1.125rem;
  font-weight: 500;
  color: #2d3748;
}
.sponsor-level {
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.25rem 0.5rem;
  border-radius: 9999px;
}
.level-platinum {
  background-color: #ed4baf;
  color: #f5e2ff;
}
.level-gold {
  background-color: #fefce8;
  color: #744210;
}
.level-silver {
  background-color: #e8e8f0;
  color: #4b5563;
}
.level-bronze {
  background-color: #f5e2de;
  color: #b34f46;
}
.button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  margin: 5px;
  width: 120px; /* 缩小按钮的宽度 */
  height: 35px; /* 缩小按钮的高度 */
  display: flex; /* 使用flex布局来居中文本 */
  justify-content: center; /* 水平居中文本 */
  align-items: center; /* 垂直居中文本 */
}
.button-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem; /* 按钮之间的间距 */
}
.version-footer {
  text-align: center;
  position: fixed;
  bottom: 0;
  width: 100%;
  background-color: #f7fafc;
  padding: 5px 0;
  font-size: 0.75rem;
  color: #4b5563;
}
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body id="V1">
<div id="V" class="container">
  <div class="features">
    <div class="feature-card">
      <p>接码合集</p>
    </div>  
  <div class="button-container" style="margin-top: 20px;">
    <button class="button" onclick="window.location.href='https://www.bfsms.com/'">接码①</button>
    <button class="button" onclick="window.location.href='https://www.jiemadi.com/'">接码②</button>
    <button class="button" onclick="window.location.href='https://yunjiema.net/'">接码③</button>
    <button class="button" onclick="window.location.href='https://mianfeijiema.com'">接码④</button>
    <button class="button" onclick="window.location.href='https://xinghai.party'">接码⑤</button>
    <button class="button" onclick="window.location.href='https://www.lothelper.com/cn/'">接码⑥</button>
    <button class="button" onclick="window.location.href='https://clearcode.cn'">接码⑦</button>
    <button class="button" onclick="window.location.href='https://yunjisms.xyz'">接码⑧</button>
    <button class="button" onclick="window.location.href='https://www.storytrain.info'">接码⑨</button>
    <button class="button" onclick="window.location.href='https://www.zusms.com/'">接码⑩</button> 
    <button class="button" onclick="window.location.href='0.html'">添加资源</button>
  </div>
  <div class="version-footer">    
  </div>
</div>
<script>
</script>
</body>
</html>
