<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络速度测试</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #3a7bd5;
            --background-color: linear-gradient(135deg, #e6e9f0, #eef1f5);
            --text-color: #333;
            --border-color: #e1e4e8;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-radius: 15px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --loading-color: rgba(74, 144, 226, 0.5);
        }

        body {
            font-family: 'Roboto', sans-serif;
            padding: 40px 20px;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: white;
            padding: 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            font-size: 3.2em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: text-shadow 0.3s ease;
        }

        input {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 35px;
            font-size: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .progress-bar {
            margin-top: 35px;
            height: 15px;
            background-color: var(--border-color);
            border-radius: 7.5px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.4s ease;
        }

        #result {
            margin-top: 50px;
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-weight: bold;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message {
            color: var(--success-color);
        }

        .error-message {
            color: var(--error-color);
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 2.5em;
            }
            input, button {
                font-size: 16px;
                padding: 18px;
            }
            #result {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>网络速度测试</h1>
        <input type="text" id="urlInput" placeholder="请输入链接">
        <button onclick="testSpeed()">测试速度</button>
        <div class="progress-bar">
            <div class="progress-bar-inner" id="progressBar"></div>
        </div>
        <div id="result" class="output"></div>
    </div>

    <script>
        async function testSpeed() {
            const urlInput = document.getElementById('urlInput').value;
            const apiUrl = `https://v2.api-m.com/api/speed?url=${encodeURIComponent(urlInput)}`;
            const resultDiv = document.getElementById('result');
            const progressBar = document.getElementById('progressBar');
            let progress = 0;

            // 显示进度条动画
            progressBar.style.width = '0%';
            resultDiv.classList.remove('visible'); // 隐藏结果

            // 启动定时器，动态更新进度条
            const startTime = Date.now();
            const updateProgress = () => {
                const elapsedTime = Date.now() - startTime;
                progress = Math.min(100, (elapsedTime / 10000) * 100); // 假设最长等待时间为10秒
                progressBar.style.width = `${progress}%`;

                if (progress >= 100) {
                    clearInterval(interval);
                }
            };
            const interval = setInterval(updateProgress, 100);

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                clearInterval(interval); // 停止进度条更新
                progressBar.style.width = '100%'; // 确保进度条达到100%

                if (data.code === 200) {
                    resultDiv.innerHTML = `<p class="success-message">测试结果：${data.data}</p>`;
                } else {
                    resultDiv.innerHTML = `<p class="error-message">测试失败：${data.msg}</p>`;
                }
            } catch (error) {
                clearInterval(interval); // 清除定时器
                progressBar.style.width = '100%'; // 确保进度条达到100%
                resultDiv.innerHTML = `<p class="error-message">测试失败：${error.message}</p>`;
            } finally {
                resultDiv.classList.add('visible'); // 显示结果
            }
        }
    </script>
</body>
</html>
