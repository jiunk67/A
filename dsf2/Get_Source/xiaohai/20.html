<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链接生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #3a7bd5;
            --background-color: linear-gradient(135deg, #e6e9f0, #eef1f5);
            --text-color: #333;
            --border-color: #e1e4e8;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-radius: 15px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --loading-color: rgba(74, 144, 226, 0.5);
        }

        body {
            font-family: 'Roboto', sans-serif;
            padding: 40px 20px;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: white;
            padding: 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            font-size: 3.2em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: text-shadow 0.3s ease;
        }

        textarea {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 35px;
            font-size: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading-text {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-container {
            width: 50px;
            height: 50px;
            border: 6px solid var(--loading-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 20px;
            transform-origin: center;
            animation-timing-function: cubic-bezier(0.5, 0.1, 0.1, 0.9);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            margin-top: 50px;
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-weight: bold;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message {
            color: var(--success-color);
        }

        .error-message {
            color: var(--error-color);
        }

        .result-link-item {
            margin-bottom: 20px;
            text-align: left;
        }

        .result-link-item h3, .result-link-item p {
            margin: 5px 0;
            word-wrap: break-word;
            white-space: normal;
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 2.5em;
            }

            textarea, button {
                font-size: 16px;
                padding: 18px;
            }

            .result {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>智能短链接生成器</h1>
        <textarea id="urls" placeholder="请输入原始链接（每行一个）"></textarea>
        <button onclick="generateShortLinks()">生成短链接</button>
        <div id="loading-text" class="loading-text">
            <span>正在生成短链接</span>
            <div class="loading-container"></div>
        </div>
        <div id="result">
            <div id="success-message" class="message success-message">短链接生成成功！</div>
            <div id="error-message" class="message error-message">请求失败，请检查网页链接合法性或稍后重试。</div>
        </div>
    </div>

    <script>
        function generateShortLinks() {
            const urlsTextarea = document.getElementById('urls');
            const urls = urlsTextarea.value.split('\n').filter(url => url.trim() !== '');
            if (urls.length === 0) {
                alert('请输入至少一个链接');
                return;
            }

            const button = document.querySelector('button');
            button.classList.add('loading');
            const loadingText = document.getElementById('loading-text');
            loadingText.style.opacity = '1';

            const apiUrl = 'https://t.apii.cn/?url=';
            const promises = urls.map(url => fetch(apiUrl + encodeURIComponent(url)).then(response => response.json()));

            Promise.all(promises)
                .then(results => {
                    const resultDiv = document.getElementById('result');
                    resultDiv.innerHTML = '<h2>生成结果</h2>';
                    results.forEach((result, index) => {
                        const linkItem = document.createElement('div');
                        linkItem.classList.add('result-link-item');
                        linkItem.innerHTML = `
                          <h3>原始链接：${urls[index]}</h3>
                          <p class="short-link">短链接：<a href="${result.url}" target="_blank">${result.url}</a></p>
                          <p class="status">状态：${result.msg}</p>
                          <p class="status">状态码：${result.code}</p>
                        `;
                        resultDiv.appendChild(linkItem);
                    });
                    resultDiv.classList.add('show');
                    button.classList.remove('loading');
                    loadingText.style.opacity = '0';
                })
                .catch(error => {
                    const resultDiv = document.getElementById('result');
                    resultDiv.innerHTML = `<p class="error-message">获取信息失败，请检查网络或输入是否正确。错误信息：${error.message}</p>`;
                    resultDiv.classList.add('show');
                    button.classList.remove('loading');
                    loadingText.style.opacity = '0';
                });
        }
    </script>
</html>
