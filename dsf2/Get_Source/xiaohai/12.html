<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机手机壁纸</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f7f7f7;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow-y: scroll;
  }
  h1 {
    color: #333;
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    background-color: #fff;
    padding: 10px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }
  #wallpaper {
    width: 80%; /* 减小图片显示区域 */
    max-width: 300px; /* 设置标准框大小 */
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 70px 0 20px;
    cursor: pointer; /* 鼠标悬停时显示为手型 */
  }
  button {
    padding: 10px 20px;
    background-color: #5cb85c;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover {
    background-color: #4cae4c;
  }
</style>
</head>
<body>
  <img id="wallpaper" src="appIcon.png" alt="点击刷新壁纸" onclick="viewWallpaper()">
  <button onclick="fetchNewWallpaper()">刷新壁纸</button>

<script>
  function fetchNewWallpaper() {
    var wallpaper = document.getElementById('wallpaper');
    fetch('https://api.52vmy.cn/api/img/tu/mo')
      .then(response => {
        if (!response.ok) {
           throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        if (data.code === 200) {
          wallpaper.src = data.url;
        } else {
          wallpaper.src = 'appIcon.png'; // 这里可以替换为一个本地的错误图片路径
        }
      })
      .catch(error => {
        wallpaper.src = 'appIcon.png'; // 这里可以替换为一个本地的错误图片路径
      });
  }

  function viewWallpaper() {
    var wallpaper = document.getElementById('wallpaper');
    var viewer = new Image();
    viewer.src = wallpaper.src;
    viewer.style.position = 'absolute';
    viewer.style.zIndex = 1000;
    viewer.style.width = '100%';
    viewer.style.height = 'auto';
    viewer.style.top = '0';
    viewer.style.left = '0';
    viewer.style.border = '1px solid #ddd';
    viewer.style.borderRadius = '8px';
    document.body.appendChild(viewer);
    viewer.onclick = function() {
      document.body.removeChild(viewer);
    }
  }

  // 页面加载时自动获取一张壁纸
  fetchNewWallpaper();
</script>
</body>
</html>
