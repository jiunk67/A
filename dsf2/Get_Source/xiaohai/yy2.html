<script>
  function setApi(){
    $("#api").children().remove();
  var apilist = $("#apiList").val().split(/\r?\n/);
  for(var i=0;i<apilist.length;i++){
    $("#api").append("<option>"+apilist[i]+"</option>");
  }
  }
$("#apiList").blur(function(){
  setApi();
  $.cookie("apiList",$("#apiList").val());
});
$("#play").click(function(){
  $api = $("#api").val();
  $url = $("#url").val();
  if($url == "" || $url == null || !/^http.*$/.test($url)){
    alert('视频地址不正确！');
    return;
  }
  if($url == "" || $url == null || !/^http.*=$/.test($api)){
    alert('无效API！');
    return;
  }
  window.open($api+$url);
});
  function init(){
    var ckapi = $.cookie("apiList");
    if(ckapi && ckapi != ""){
      $("#apiList").val(ckapi);
    }
    setApi();
  }
  init();
  function setDefault(){
    $.cookie("apiList","");
    window.location.reload();
  }	
</script>

<script>

		var announcement = document.getElementById('announcement');
		var enterButton = document.getElementById('enter-button');
		var welcomeMsg = document.getElementById('welcome-msg');

	
		function enter() {
		
			closeAnnouncement();
		
			welcomeMsg.innerText = '欢迎回来！祝您使用愉快';
			welcomeMsg.style.display = 'block';
			setTimeout(function () {
				welcomeMsg.style.display = 'none';
			}, 3000);
		}


		function closeAnnouncement() {

			announcement.style.display = 'none';
	
			enterButton.removeEventListener('click', enter);
		}

	
		enterButton.addEventListener('click', enter);

		
		announcement.addEventListener('click', function (event) {
			event.stopPropagation();
		});

	
		window.onload = function () {
			enterButton.focus();
		};
	</script>
