<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
			*{
				/* 清空默认边距 */
				margin: 0;
				padding: 0;
			}
			body{
				background: pink;
			}
			.envelope{
				/* 绝对定位 */
				position: absolute;
				top: 20%;
				left: 20%;
				
				/* 盒子阴影 */
				box-shadow: 2px 20px 20px rgba(0, 0, 0, .1);
				
				/* 居中内容 */
				display: flex;
				justify-content: center;
				align-items: center;
				
				width: 500px;
				height: 350px;
				background: #fad4bf;
				/* 旋转9度 */
				transform: rotate(9deg) scale(1.5);
			}
			.content{
				position: absolute;
				
				/* 过渡 */
				transition: 2s;
				/* 行高 */
				line-height: 1.6em;
				padding: 2em;
				/* css3盒子模型 */
				box-sizing: border-box;
				
				background: white;
				width: 95%;
				height: 90%;
				
				/* 透明度暂时设为0 */
				opacity: 0;
			}
			
			/* 三角形 */
			.top{
				/* position: absolute; */
				margin-left: 16px;
				width: 1px;
				height: 1px;
				border-top: 175px solid red;
				border-left: 250px solid transparent;
				border-right: 250px solid transparent;
				border-bottom: 175px solid transparent;
			}
			/* 在三角形内部添加一个三角形 */
			.top::before{
				/* 伪元素需要块状显示 才能定位 */
				display: block;
				position: absolute;
				filter: brightness(1.1);
				content: '';
				top: -4px;
				left: 8px;
				width: 1px;
				height: 1px;
				border-top: 175px solid #fad4bf;
				border-left: 250px solid transparent;
				border-right: 250px solid transparent;
				border-bottom: 175px solid transparent;
			}
			
			span{
				position: absolute;
				font-size: 60px;
				color: red;
				text-shadow: 2px 2px 20px rgba(255, 0, 0, .5);
				/* 调用动画 无限循环*/
				animation: scale 0.5s infinite alternate;
			}
			/* 缩放动画 */
			@keyframes scale{
				100%{
					transform: scale(1.2);
				}
			}
			/* 输入框和按钮的样式 */
			.input-container{
				position: absolute;
				top: 10px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 10px;
			}
			.input-container input{
				padding: 5px;
				border: 1px solid #ccc;
				border-radius: 5px;
			}
			.input-container button{
				padding: 5px 10px;
				border: none;
				background-color: #007bff;
				color: white;
				border-radius: 5px;
				cursor: pointer;
			}
			.input-container button:hover{
				background-color: #0056b3;
			}
		</style>
	</head>
	<body>
		<div class="input-container">
			<input type="text" id="customMessage" placeholder="输入信封内容">
			<button id="setCustomMessage">确定</button>
		</div>
		<div class="envelope">
			<div class="top"></div>
			<span>❤</span>
			<div class="content">
				<p></p>
			</div>
		</div>
		<script>
			// 获取信封和p
			let envelop = document.querySelector('.envelope')
			let p = document.querySelector('p')
			let input = document.getElementById('customMessage')
			let button = document.getElementById('setCustomMessage')
			
			// 默认内容
			let str = '昨天太近，明天太远。选在今日对你说我喜欢你，或许我不够优秀，但可以给我一次机会吗？让我们共同进步，变得更好。'
			
			// 点击确定按钮后设置自定义内容
			button.onclick = function(){
				str = input.value || str // 如果输入框为空，则使用默认内容
			}
			
			//点击信封后触发
			envelop.onclick = function(){
				
				document.querySelector('.content').style.opacity = 0.9
				
				// 定时器 循环执行代码
				let i = 0
				let timer = setInterval(function(){
					if(i > str.length - 1){
						clearInterval(timer)
						return
					}
					p.innerHTML += str[i]
					i++
				},200)
				
			}
		</script>
	</body>
</html>
