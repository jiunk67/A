<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小海机器人</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .header {
            background-color: #000;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .tip {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            text-align: center;
            border-radius: 5px;
            margin: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .tip:hover {
            opacity: 0.7;
        }
        #main {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding: 20px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            gap: 80px;
        }
        .item {
            display: flex;
            align-items: flex-end;
            width: 100%;
        }
        .item-left {
            justify-content: flex-start;
        }
        .item-right {
            justify-content: flex-end;
        }
        .message-text {
            background-color: #fff;
            color: #000;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message-text-right {
            background-color: #00ced1;
            color: #fff;
            border-radius: 10px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message-text a, .message-text-right a {
            color: #007bff;
            text-decoration: none;
        }
        .message-text a:hover, .message-text-right a:hover {
            text-decoration: underline;
        }
        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000;
            padding: 10px;
            box-shadow: 0 -2px 10px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 10px 10px;
        }
        #sendText {
            width: 80%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 16px;
            color: #fff;
            background-color: #000;
            margin-right: 10px;
        }
        #sendButton {
            width: 50px;
            height: 50px;
            padding: 0;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendButton:hover {
            background-color: #0056b3;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>小海机器人</h1>
    </div>
    <div class="tip" id="tip">发送“菜单”查看小海功能菜单，发送“help”查看菲菲功能菜单，不使用功能可以和他闲聊！</div>
    <div id="main"></div>
    <div id="footer">
        <input id="sendText" type="text" placeholder="请输入内容"/>
        <button id="sendButton">发送</button>
    </div>
    <script>
        const apiUrl = "https://zy.xywlapi.cc/qqapi?qq=";
        const qingyunkeApi = "http://api.qingyunke.com/api.php?key=free&appid=0&msg=";
        const baiduSearchApi = "https://www.baidu.com/s?wd=";
        const main = document.getElementById('main');
        const sendText = document.getElementById('sendText');
        const sendButton = document.getElementById('sendButton');
        const tip = document.getElementById('tip');

        sendButton.addEventListener('click', () => {
            const message = sendText.value.trim();
            if (!message) return;
            addMessage(0, message);
            sendText.value = '';

            if (tip) {
                tip.style.display = 'none';
            }

            if (message === '菜单') {
                addMessage(1, "小海功能菜单：\n①Q绑查询【示例――①+想查QQ号】\n②随机美女视频【示例――直接发②】\n③聚合搜索【示例――③+问题】PS：商务TG:xh088a");
            } else if (message.startsWith('①')) {
                const qq = message.split('①')[1].trim();
                if (qq === '') {
                    addMessage(1, "请输入QQ号");
                    return;
                }
                fetch(apiUrl + qq)
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 500) {
                            addMessage(1, "查询失败：" + data.message);
                        } else {
                            const result = [
                                `<strong>QQ号码:</strong> ${data.qq}`,
                                `<strong>手机号码:</strong> ${data.phone}`,
                                `<strong>手机号码归属地:</strong> ${data.phonediqu}`,
                                `<strong>注：数据由小海科技提供</strong>`
                            ].join('<br>');
                            addMessage(1, result);
                        }
                    })
                    .catch(error => {
                        addMessage(1, "查询出错：" + error.message);
                    });
            } else if (message === '②') {
                const videoContainer = document.createElement('div');
                videoContainer.className = 'video-container';
                const iframe = document.createElement('iframe');
                iframe.src = "https://api.178v.cn/api/sjkssp/api.php?apikey=f643cdbe-7639-2e1b-a634-e13ded5a13f5d9183623";
                iframe.frameborder = "0";
                iframe.allowfullscreen = "true";
                videoContainer.appendChild(iframe);
                addMessage(1, videoContainer);
            } else if (message.startsWith('③')) {
                const query = message.split('③')[1].trim();
                if (query === '') {
                    addMessage(1, "请输入问题");
                    return;
                }
                const searchUrl = baiduSearchApi + encodeURIComponent(query);
                addMessage(1, `<a href="${searchUrl}" target="_blank">搜索结果</a>`);
            } else {
                fetch(qingyunkeApi + encodeURIComponent(message))
                    .then(response => response.json())
                    .then(result => addMessage(1, result.content))
                    .catch(err => console.error('Error:', err));
            }
        });

        function addMessage(type, message) {
            const messageElement = document.createElement('div');
            messageElement.className = `item item-${type === 1 ? 'left' : 'right'}`;
            if (message instanceof HTMLElement) {
                messageElement.appendChild(message);
            } else {
                const textElement = document.createElement('div');
                textElement.className = `message-text${type === 0 ? '-right' : ''}`;
                textElement.innerHTML = message.replace(/{br}/g, '<br>');
                messageElement.appendChild(textElement);
            }
            main.appendChild(messageElement);
            main.scrollTop = main.scrollHeight;
        }
    </script>
</body>
</html>
