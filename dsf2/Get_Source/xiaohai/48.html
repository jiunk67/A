<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 5px;
            font-size: 16px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #008866;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #009566;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script>
        function convert() {
            let input = document.getElementById("input").value;
            let fromBase = parseInt(document.getElementById("fromBase").value);
            let toBase = parseInt(document.getElementById("toBase").value);
            let result = parseInt(input, fromBase).toString(toBase);
            document.getElementById("result").innerHTML = "结果： " + result;
        }
    </script>
    <div class="container">
        <h1>进制转换</h1>
        <label for="input">输入数字：</label>
        <input type="text" id="input">
        <label for="fromBase">原进制(最大36，最小2)：</label>
        <input type="number" id="fromBase" min="2" max="36">
        <label for="toBase">目标进制(最大36，最小2)：</label>
        <input type="number" id="toBase" min="2" max="36">
        <button onclick="convert()">转换</button>
        <p id="result"></p>
    </div>
</body>
</html>
