<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球实时汇率表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            neutral: '#F5F7FA',
            dark: '#1D2129',
            light: '#F2F3F5'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .ad-btn {
        @apply px-4 py-3 rounded-lg bg-primary text-white font-medium transition-all hover:bg-primary/90 hover:shadow-md text-center;
      }
    }
  </style>
</head>

<body class="font-inter bg-neutral min-h-screen text-dark">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-sm sticky top-0 z-40 transition-all duration-300">
    <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
      <div class="mb-4 md:mb-0">
        <h1 class="text-[clamp(1.25rem,3vw,1.75rem)] font-bold text-dark">全球实时汇率表</h1>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <div class="relative w-full sm:w-64">
          <input 
            type="text" 
            id="searchInput"
            placeholder="搜索货币代码或名称..." 
            class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
          >
        </div>
        
        <button id="refreshBtn" class="flex items-center justify-center px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all shadow-md hover:shadow-lg">
          刷新数据
        </button>
      </div>
    </div>
  </header>

  <!-- 推荐服务按钮区域 -->
  <div class="container mx-auto px-4 py-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- 流量卡服务按钮 -->
      <a href="https://h5.lot-ml.com/ProductEn/Index/b750d8f352b57682" target="_blank" class="ad-btn">
        办理大流量卡 <span class="text-xs bg-white/20 px-2 py-0.5 rounded ml-1">办理即有奖励</span>
      </a>
      
      <!-- 业务网服务按钮 -->
      <a href="http://xlzuis.empiretreasure.vip/sc/" target="_blank" class="ad-btn">
        访问超多业务网
      </a>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="container mx-auto px-4 py-6">
    <div class="bg-white rounded-lg p-4 mb-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center">
      <div class="mb-3 sm:mb-0">
        <span id="dataCount" class="text-gray-600">加载中...</span>
      </div>
      <div class="flex items-center text-sm text-gray-500">
        <span>最后更新: </span>
        <span id="lastUpdate" class="ml-1">加载中...</span>
      </div>
    </div>
    
    <div class="bg-white rounded-lg overflow-hidden shadow-sm mb-6">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-light border-b border-gray-200">
              <<<<th class="px-4 py-3 font-semibold text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors" data-sort="code">
                货币代码
              </</</</th>
              <<<<th class="px-4 py-3 font-semibold text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors" data-sort="name">
                货币名称
              </</</</th>
              <<<<th class="px-4 py-3 font-semibold text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors" data-sort="rate">
                汇率 (1 USD)
              </</</</th>
            </tr>
          </thead>
          <tbody id="ratesTableBody">
            <tr>
              <td colspan="3" class="px-4 py-12 text-center text-gray-500">
                <div class="flex flex-col items-center">
                  <div class="w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin mb-4"></div>
                  <p>正在加载汇率数据...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div id="noResults" class="hidden px-4 py-12 text-center text-gray-500">
        <p>未找到匹配的货币</p>
      </div>
    </div>
    
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <h2 class="text-lg font-semibold mb-4">汇率转换计算器</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">金额</label>
          <input type="number" id="amount" value="1" min="0" step="0.01" 
                class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">从</label>
          <select id="fromCurrency" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none appearance-none bg-white">
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">到</label>
          <select id="toCurrency" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none appearance-none bg-white">
          </select>
        </div>
      </div>
      <div class="mt-4 p-3 bg-neutral rounded-lg">
        <p class="text-center text-lg font-medium" id="conversionResult">
          1 USD = 7.21 CNY
        </p>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-gray-200 mt-8 py-4">
    <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
      <p>数据来源: <a href="https://v2.xxapi.cn/api/allrates" class="text-primary hover:underline" target="_blank">汇率API</a></p>
      <p class="mt-1">© 2025 全球实时汇率表 | 仅供参考</p>
    </div>
  </footer>

  <script>
    let ratesData = [];
    let currentSort = { field: null, direction: 'asc' };
    
    // DOM元素
    const ratesTableBody = document.getElementById('ratesTableBody');
    const dataCountElement = document.getElementById('dataCount');
    const lastUpdateElement = document.getElementById('lastUpdate');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const noResultsElement = document.getElementById('noResults');
    const fromCurrencySelect = document.getElementById('fromCurrency');
    const toCurrencySelect = document.getElementById('toCurrency');
    const amountInput = document.getElementById('amount');
    const conversionResultElement = document.getElementById('conversionResult');
    const header = document.querySelector('header');
    
    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', () => {
      fetchRates();
      
      // 绑定事件
      amountInput.addEventListener('input', updateConversion);
      fromCurrencySelect.addEventListener('change', updateConversion);
      toCurrencySelect.addEventListener('change', updateConversion);
      searchInput.addEventListener('input', debounce(filterRates, 300));
      
      refreshBtn.addEventListener('click', () => {
        refreshBtn.classList.add('animate-pulse');
        fetchRates().finally(() => {
          refreshBtn.classList.remove('animate-pulse');
        });
      });
      
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const field = th.getAttribute('data-sort');
          sortRates(field);
        });
      });
      
      window.addEventListener('scroll', () => {
        if (window.scrollY > 10) {
          header.classList.add('py-2', 'shadow');
          header.classList.remove('py-4', 'shadow-sm');
        } else {
          header.classList.add('py-4', 'shadow-sm');
          header.classList.remove('py-2', 'shadow');
        }
      });
    });
    
    // 获取汇率数据
    async function fetchRates() {
      try {
        const response = await fetch('https://v2.xxapi.cn/api/allrates');
        const data = await response.json();
        
        if (data.code === 200 && data.data && data.data.rates) {
          ratesData = Object.entries(data.data.rates).map(([code, info]) => ({
            code,
            name: info.name,
            rate: info.rate
          }));
          
          renderRatesTable(ratesData);
          populateCurrencySelects();
          dataCountElement.textContent = `共 ${data.data.count} 种货币汇率`;
          
          const updateTime = new Date(data.data.update_at);
          lastUpdateElement.textContent = updateTime.toLocaleString();
        } else {
          throw new Error('获取数据失败');
        }
      } catch (error) {
        console.error('获取汇率数据失败:', error);
        ratesTableBody.innerHTML = `
          <tr>
            <td colspan="3" class="px-4 py-12 text-center text-gray-500">
              <div class="flex flex-col items-center">
                <p>加载数据失败</p>
                <button onclick="fetchRates()" class="mt-2 text-primary hover:underline">
                  重试
                </button>
              </div>
            </td>
          </tr>
        `;
      }
    }
    
    // 渲染汇率表格
    function renderRatesTable(rates) {
      ratesTableBody.innerHTML = '';
      
      if (rates.length === 0) {
        noResultsElement.classList.remove('hidden');
        return;
      }
      
      noResultsElement.classList.add('hidden');
      
      rates.forEach((rate, index) => {
        const row = document.createElement('tr');
        row.className = `border-b border-gray-100 hover:bg-primary/5 transition-colors ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`;
        const formattedRate = formatRate(rate.rate);
        
        row.innerHTML = `
          <td class="px-4 py-3 font-medium">${rate.code}</td>
          <td class="px-4 py-3">${rate.name}</td>
          <td class="px-4 py-3 text-right font-mono">${formattedRate}</td>
        `;
        
        ratesTableBody.appendChild(row);
      });
    }
    
    // 过滤汇率数据
    function filterRates() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      
      if (!searchTerm) {
        renderRatesTable(ratesData);
        return;
      }
      
      const filteredRates = ratesData.filter(rate => 
        rate.code.toLowerCase().includes(searchTerm) || 
        rate.name.toLowerCase().includes(searchTerm)
      );
      
      renderRatesTable(filteredRates);
    }
    
    // 排序汇率数据
    function sortRates(field) {
      const sortedRates = [...ratesData].sort((a, b) => {
        if (currentSort.field === field) {
          currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
          currentSort = { field, direction: 'asc' };
        }
        
        if (field === 'rate') {
          return currentSort.direction === 'asc' ? a[field] - b[field] : b[field] - a[field];
        } else {
          if (a[field] < b[field]) return currentSort.direction === 'asc' ? -1 : 1;
          if (a[field] > b[field]) return currentSort.direction === 'asc' ? 1 : -1;
          return 0;
        }
      });
      
      renderRatesTable(sortedRates);
    }
    
    // 填充货币选择下拉框
    function populateCurrencySelects() {
      fromCurrencySelect.innerHTML = '';
      toCurrencySelect.innerHTML = '';
      
      ratesData.forEach(rate => {
        const fromOption = document.createElement('option');
        fromOption.value = rate.code;
        fromOption.textContent = `${rate.code} - ${rate.name}`;
        fromCurrencySelect.appendChild(fromOption);
        
        const toOption = document.createElement('option');
        toOption.value = rate.code;
        toOption.textContent = `${rate.code} - ${rate.name}`;
        toCurrencySelect.appendChild(toOption);
      });
      
      fromCurrencySelect.value = 'USD';
      toCurrencySelect.value = 'CNY';
    }
    
    // 更新汇率转换结果
    function updateConversion() {
      const amount = parseFloat(amountInput.value) || 0;
      const fromCode = fromCurrencySelect.value;
      const toCode = toCurrencySelect.value;
      
      const fromRate = ratesData.find(r => r.code === fromCode)?.rate || 1;
      const toRate = ratesData.find(r => r.code === toCode)?.rate || 1;
      const result = amount * (toRate / fromRate);
      
      conversionResultElement.textContent = `${amount.toFixed(2)} ${fromCode} = ${result.toFixed(2)} ${toCode}`;
    }
    
    // 格式化汇率显示
    function formatRate(rate) {
      if (rate < 0.0001) return rate.toExponential(6);
      else if (rate >= 1000) return rate.toFixed(2);
      else if (rate >= 1) return rate.toFixed(4);
      else if (rate >= 0.001) return rate.toFixed(6);
      return rate.toFixed(8);
    }
    
    // 防抖函数
    function debounce(func, delay) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
      };
    }
  </script>
</body>
</html>
