<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚合空间 · COSMOS</title>
<style>
:root{
  --bg:#f5f5f7;
  --text:#1d1d1f;
  --transition:.3s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg);color:var(--text);
}
header{
  position:sticky;top:0;
  display:flex;align-items:center;
  padding:14px 20px;
  background:#fff;
  border-bottom:1px solid #d2d2d7;
  z-index:10;
}
.back{
  font-size:26px;
  font-weight:600;
  color:var(--text);
  cursor:pointer;
  margin-right:12px;
  user-select:none;
}
hgroup{line-height:1}
h1{font-size:28px;font-weight:700;letter-spacing:.5px}
p{font-size:13px;color:#6e6e73;margin-top:2px}
main{padding:32px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{
  position:relative;
  border-radius:18px;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:24px;color:#fff;
  min-height:160px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:var(--transition);
  cursor:pointer;
}
.card:hover{transform:translateY(-4px)}
.card h2{font-size:18px;font-weight:600}
.card small{font-size:13px;opacity:.9;margin-top:4px;line-height:1.4}
.card .enter{
  align-self:flex-end;
  font-size:13px;
  font-weight:600;
  border:1px solid #fff;
  border-radius:20px;
  padding:4px 14px;
  margin-top:12px;
  transition:var(--transition);
}
.card:hover .enter{background:#fff;color:#000}
/* 六款主题色 */
.card:nth-child(1){background:linear-gradient(135deg,#667eea 0%, #764ba2 100%);}
.card:nth-child(2){background:linear-gradient(135deg,#f093fb 0%, #f5576c 100%);}
.card:nth-child(3){background:linear-gradient(135deg,#4facfe 0%, #00f2fe 100%);}
.card:nth-child(4){background:linear-gradient(135deg,#43e97b 0%, #38f9d7 100%);}
.card:nth-child(5){background:linear-gradient(135deg,#fa709a 0%, #fee140 100%);}
.card:nth-child(6){background:linear-gradient(135deg,#a8edea 0%, #fed6e3 100%);color:#333}
.card:nth-child(6) .enter{border-color:#333;color:#333}
.card:nth-child(6):hover .enter{background:#333;color:#fff}
</style>
</head>
<body>

<header>
  <hgroup>
    <h1>聚合空间</h1>
    <p>一键触达全宇宙</p>
  </hgroup>
</header>

<main> 
  <div class="card" onclick="location.href='4.html'">
    <div>
      <h2>网站聚合</h2>
      <small>精选常用网址，效率起飞</small>
    </div>
    <span class="enter">进入</span>
  </div>

  <div class="card" onclick="location.href='ys.html'">
    <div>
      <h2>影院聚合</h2>
      <small>热门影视一站看遍</small>
    </div>
    <span class="enter">进入</span>
  </div>

  <div class="card" onclick="location.href='jm.html'">
    <div>
      <h2>接码聚合</h2>
      <small>多平台验证码接收</small>
    </div>
    <span class="enter">进入</span>
  </div>

  <div class="card" onclick="location.href='5.html'">
    <div>
      <h2>软件聚合</h2>
      <small>必备工具极速获取</small>
    </div>
    <span class="enter">进入</span>
  </div>

  <div class="card" onclick="location.href='index.html'">
    <div>
      <h2>点我返回明月软件库主页</h2>
      <small>官方服务一站式办理</small>
    </div>
    <span class="enter">进入</span>
  </div>

  <div class="card" onclick="location.href='index.html'">
    <div>
      <h2>音乐聚合</h2>
      <small>千万曲库随听随下</small>
    </div>
    <span class="enter">进入</span>
  </div>
</main>

</body>
</html>
