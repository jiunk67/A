<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码验证 - 随机实名认证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }

        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            transition: all 0.3s ease;
            outline: none;
        }

        .password-input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00e5ff, #7e57c2);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #00e5ff;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
            }
            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lock-icon">🔒</div>
        <h2>访问受限</h2>
        <p class="subtitle">请输入密码继续访问随机实名认证</p>
        <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码" maxlength="20">
        <button class="submit-btn" onclick="checkPassword()">确认进入</button>
        <p class="error-msg" id="errorMsg">密码错误，请重新输入</p>
        <a href="index.html" class="back-btn">← 返回首页</a>
    </div>

    <script>
      
        const CORRECT_PASSWORD_ENCODED = 'MDAwMDAw';
        const TARGET_PATH_ENCODED = 'c2pzbS9pbmRleC5odG1s';

       
        if (sessionStorage.getItem('sjsm_verified') === 'true') {
            window.location.href = atob(TARGET_PATH_ENCODED);
        }

        // 回车键提交
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const errorMsg = document.getElementById('errorMsg');
            const container = document.querySelector('.container');
            const password = input.value.trim();
            
            // 将用户输入的密码进行Base64编码后比较
            const encodedInput = btoa(password);

            if (encodedInput === CORRECT_PASSWORD_ENCODED) {
                // 密码正确，设置验证状态并跳转
                sessionStorage.setItem('sjsm_verified', 'true');
                window.location.href = atob(TARGET_PATH_ENCODED);
            } else {
                // 密码错误，显示错误信息并抖动
                errorMsg.classList.add('show');
                container.classList.add('shake');
                input.value = '';
                input.focus();

                // 移除抖动动画
                setTimeout(() => {
                    container.classList.remove('shake');
                }, 500);
            }
        }

        // 页面加载时聚焦输入框
        window.onload = function() {
            document.getElementById('passwordInput').focus();
        };
    </script>
    <script src="bgMusic.js"></script>
</body>
</html>
