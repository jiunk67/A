<head>
    <meta charset="UTF-8">

    <title>公益网盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .page-container {
            width: 100vw;
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px;
            overflow: auto;
        }

        .page-title {
            color: #ffffff;
            font-size: 36px;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
        }

        .btn-item {
            padding: 18px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-item:active::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
                margin-bottom: 30px;
            }
            .btn-item {
                padding: 15px 0;
                font-size: 13px;
            }
            .btn-grid {
                gap: 15px;
            }
            .back-btn {
                padding: 10px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
