<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT管理器，删所有模块</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            text-align: center;
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 32px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .video-container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .back-btn {
            margin-top: 30px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(30, 30, 50, 0.95);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3), 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .modal-text {
            color: #ffffff;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .modal-btn {
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #00e5ff, #7e57c2);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <p class="modal-text">直接删掉Adb目录里面的modules更保险，直接删adb可能成砖</p>
            <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
    </div>

    <h1 class="page-title">MT管理器，删所有模块</h1>

    <div class="video-container">
        <video controls>
            <source src="sp/O.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
    </div>

    <a href="main6.html" class="back-btn">返回</a>

    <script>
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
    <script src="sp/musicPlayer.js"></script>
</body>
</html>
