<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢捐赠 - π颗糖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px;
        }

        .page-title {
            font-size: 36px;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .thanks-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 600px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .donate-btn {
            padding: 18px 45px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .donate-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 10px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 90%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            margin-top: 15px;
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            background: rgba(0, 229, 255, 0.3);
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        .tips {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
                margin-bottom: 15px;
            }
            .thanks-text {
                font-size: 16px;
                margin-bottom: 30px;
            }
            .donate-btn {
                padding: 15px 35px;
                font-size: 18px;
            }
            .back-btn {
                padding: 10px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h1 class="page-title">❤️ 感谢您的支持 ❤️</h1>
    
    <div class="thanks-text">
        每一份捐赠都是对我创作的认可与鼓励<br>
        您的支持将帮助我产出更多优质的教程与资源<br>
        万分感谢，愿我们一起在技术的路上并肩前行！
    </div>

    <button class="donate-btn" onclick="showModal()">点击查看捐赠方式</button>

    <div class="tips">
        小小心意，不限金额，感谢您的慷慨解囊~
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal-content">
            <img src="./sp/K.jpg" alt="捐赠码" class="modal-img">
            <button class="close-btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        const modalMask = document.getElementById("modalMask");

        function showModal() {
            modalMask.style.display = "flex";
        }

        function closeModal() {
            modalMask.style.display = "none";
        }

        modalMask.addEventListener("click", function(e) {
            if (e.target === modalMask) {
                closeModal();
            }
        });
    </script>
    <script>
        class GlobalMusicPlayer {
            constructor() {
                this.audio = null;
                this.isPlaying = false;
                this.currentTime = 0;
                this.volume = 0.5;
                this.isMuted = false;
                this.init();
            }

            init() {
                if (this.audio) return;
                this.audio = new Audio('./music/music.mp3');
                this.audio.loop = true;
                this.audio.volume = this.volume;
                this.loadState();
                this.audio.addEventListener('timeupdate', () => {
                    this.currentTime = this.audio.currentTime;
                    this.saveState();
                });
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.saveState();
                });
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.saveState();
                });
                this.audio.addEventListener('ended', () => {
                    this.isPlaying = false;
                    this.saveState();
                });
                this.createPlayerUI();
                if (this.isPlaying) {
                    this.audio.currentTime = this.currentTime;
                    this.audio.play().catch(() => {});
                }
            }

            loadState() {
                const savedState = localStorage.getItem('musicPlayerState');
                if (savedState) {
                    const state = JSON.parse(savedState);
                    this.currentTime = state.currentTime || 0;
                    this.volume = state.volume || 0.5;
                    this.isMuted = state.isMuted || false;
                    this.isPlaying = state.isPlaying || false;
                }
            }

            saveState() {
                const state = {
                    currentTime: this.audio.currentTime,
                    volume: this.audio.volume,
                    isMuted: this.audio.muted,
                    isPlaying: !this.audio.paused
                };
                localStorage.setItem('musicPlayerState', JSON.stringify(state));
            }

            createPlayerUI() {
                const existingPlayer = document.getElementById('global-music-player');
                if (existingPlayer) return;
                const player = document.createElement('div');
                player.id = 'global-music-player';
                player.innerHTML = `
                    <style>
                        #global-music-player {
                            position: fixed;
                            bottom: 20px;
                            right: 20px;
                            z-index: 1000;
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            padding: 12px 20px;
                            background: rgba(255,255,255, 0.1);
                            backdrop-filter: blur(10px);
                            -webkit-backdrop-filter: blur(10px);
                            border-radius: 50px;
                            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
                            transition: all 0.3s ease;
                        }
                        #global-music-player:hover {
                            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 6px 20px rgba(0, 0, 0, 0.3);
                            background: rgba(255,255,255, 0.15);
                        }
                        .music-icon {
                            width: 24px;
                            height: 24px;
                            fill: #ffffff;
                            animation: pulse 2s ease-in-out infinite;
                        }
                        .music-icon.paused {
                            animation: none;
                            opacity: 0.5;
                        }
                        @keyframes pulse {
                            0%, 100% { transform: scale(1); }
                            50% { transform: scale(1.1); }
                        }
                        .music-btn {
                            width: 44px;
                            height: 44px;
                            border: 2px solid rgba(0, 229, 255, 0.5);
                            border-radius: 50%;
                            background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(126, 87, 194, 0.2));
                            color: #ffffff;
                            cursor: pointer;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                            font-size: 18px;
                            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255, 0.1);
                            position: relative;
                            overflow: hidden;
                        }
                        .music-btn::before {
                            content: '';
                            position: absolute;
                            top: 50%;
                            left: 50%;
                            width: 0;
                            height: 0;
                            border-radius: 50%;
                            background: rgba(255,255,255, 0.3);
                            transform: translate(-50%, -50%);
                            transition: width 0.3s ease, height 0.3s ease;
                        }
                        .music-btn:hover {
                            border-color: rgba(126, 87, 194, 0.7);
                            background: linear-gradient(135deg, rgba(0, 229, 255, 0.3), rgba(126, 87, 194, 0.3));
                            transform: scale(1.15) translateY(-2px);
                            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255, 0.2);
                        }
                        .music-btn:active {
                            transform: scale(1.05) translateY(0);
                        }
                        .music-btn:active::before {
                            width: 200%;
                            height: 200%;
                        }
                        .volume-slider {
                            width: 80px;
                            height: 4px;
                            -webkit-appearance: none;
                            appearance: none;
                            background: rgba(255,255,255, 0.3);
                            border-radius: 2px;
                            outline: none;
                            cursor: pointer;
                        }
                        .volume-slider::-webkit-slider-thumb {
                            -webkit-appearance: none;
                            appearance: none;
                            width: 12px;
                            height: 12px;
                            border-radius: 50%;
                            background: #00e5ff;
                            cursor: pointer;
                            transition: all 0.2s ease;
                        }
                        .volume-slider::-webkit-slider-thumb:hover {
                            transform: scale(1.2);
                            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
                        }
                        .volume-slider::-moz-range-thumb {
                            width: 12px;
                            height: 12px;
                            border-radius: 50%;
                            background: #00e5ff;
                            cursor: pointer;
                            border: none;
                        }
                        @media (max-width: 768px) {
                            #global-music-player {
                                bottom: 15px;
                                right: 15px;
                                padding: 10px 15px;
                            }
                            .volume-slider {
                                width: 60px;
                            }
                            .music-btn {
                                width: 40px;
                                height: 40px;
                                font-size: 16px;
                            }
                        }
                    </style>
                    <svg class="music-icon ${this.isPlaying ? '' : 'paused'}" viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                    <button class="music-btn" id="playPauseBtn">
                        ${this.isPlaying ? '⏸' : '▶'}
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="${this.volume}">
                `;
                document.body.appendChild(player);
                const playPauseBtn = document.getElementById('playPauseBtn');
                const volumeSlider = document.getElementById('volumeSlider');
                const musicIcon = player.querySelector('.music-icon');
                playPauseBtn.addEventListener('click', () => {
                    this.togglePlay();
                });
                volumeSlider.addEventListener('input', (e) => {
                    this.setVolume(e.target.value);
                });
                this.playPauseBtn = playPauseBtn;
                this.musicIcon = musicIcon;
            }

            togglePlay() {
                if (this.audio.paused) {
                    this.audio.play();
                    this.playPauseBtn.textContent = '⏸';
                    this.musicIcon.classList.remove('paused');
                } else {
                    this.audio.pause();
                    this.playPauseBtn.textContent = '▶';
                    this.musicIcon.classList.add('paused');
                }
            }

            setVolume(value) {
                this.audio.volume = value;
                this.volume = value;
                this.saveState();
            }

            play() {
                this.audio.play();
                this.playPauseBtn.textContent = '⏸';
                this.musicIcon.classList.remove('paused');
            }

            pause() {
                this.audio.pause();
                this.playPauseBtn.textContent = '▶';
                this.musicIcon.classList.add('paused');
            }
        }

        let globalMusicPlayer;

        document.addEventListener('DOMContentLoaded', () => {
            globalMusicPlayer = new GlobalMusicPlayer();
        });
    </script>
</body>
</html>    <script src="music-player.js"></script>
</body>
</html>
