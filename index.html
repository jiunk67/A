<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>π颗糖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(15, 23, 42, 0.8)), url("./sp/your-background-image.jpg");
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3), transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.2), transparent 40%);
            z-index: 0;
        }

        .site-title {
            color: #ffffff;
            font-size: 52px;
            margin-bottom: 80px;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 20px rgba(0, 0, 0, 0.5);
            animation: titleFloat 4s ease-in-out infinite alternate;
            z-index: 1;
            -webkit-text-stroke: 0.5px rgba(0, 200, 255, 0.5);
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            width: 75%;
            max-width: 900px;
            z-index: 1;
        }

        .custom-btn {
            padding: 18px 35px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(90deg, #00e5ff, #7e57c2);
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .custom-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 12px 30px rgba(0, 0, 0, 0.2);
            background-image: linear-gradient(90deg, #7e57c2, #00e5ff);
        }

        .custom-btn:active::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: btnRipple 0.6s ease-out;
        }

        .footer-info {
            margin-top: 50px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            z-index: 1;
        }

        .footer-info p {
            margin-bottom: 5px;
        }

        .footer-info small {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        @keyframes titleFloat {
            from {
                transform: translateY(0);
                text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 20px rgba(0, 0, 0, 0.5);
            }
            to {
                transform: translateY(-15px);
                text-shadow: 0 0 25px rgba(0, 200, 255, 1), 0 4px 25px rgba(0, 0, 0, 0.6);
            }
        }

        @keyframes btnRipple {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .site-title {
                font-size: 36px;
                margin-bottom: 50px;
                letter-spacing: 5px;
            }
            .custom-btn {
                padding: 15px 25px;
                font-size: 18px;
            }
            .btn-group {
                width: 90%;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="site-title">资源分享</h1>

        <div class="btn-group">
            <a href="main1.html" class="custom-btn">辅助教程</a>
            <a href="main2.html" class="custom-btn">辅助网盘</a>
            <a href="main3.html" class="custom-btn">数据号</a>
            <a href="main4.html" class="custom-btn">工具软件下载</a>
            <a href="main5.html" class="custom-btn">捐赠支持</a>
            <a href="main6.html" class="custom-btn">手机Root使用</a>
            <a href="main15.html" class="custom-btn">分类</a>
            <a href="sjsm_password.html" class="custom-btn">随机实名</a>
        </div>

        <div class="footer-info">
            <p>π颗糖 - 资源分享站点</p>
            <small>最后更新: 2026.3.22</small>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>温馨提示</h2>
            <p>本网站为AI与本人的共同制作，有些部分可能有错误，请自行分辨使用</p>
            <button onclick="closeModal()">确定</button>
        </div>
    </div>

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: #60a5fa;
        }
        .modal-content p {
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .modal-content button {
            padding: 12px 40px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .modal-content button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
    </style>

    <script>
        window.onload = function() {
            if (!localStorage.getItem('modalShown')) {
                document.getElementById('modal').style.display = 'flex';
            }
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            localStorage.setItem('modalShown', 'true');
        }
    </script>
    <script src="bgMusic.js"></script>
</body>
</html>
