<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿尔法隐藏 - 视频教程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            text-align: center;
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 32px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .video-container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .back-btn {
            margin-top: 30px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">阿尔法隐藏 - 视频教程</h1>

    <div class="video-container">
        <video controls>
            <source src="sp/L.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
    </div>

    <a href="main7.html" class="back-btn">返回</a>
</body>
</html>
