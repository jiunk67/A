<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机实名认证</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .log-box {
            width: 100%;
            height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #45a049;
        }
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .log-box {
                height: 150px;
                font-size: 12px;
            }
            .btn {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea class="log-box" id="logBox" readonly placeholder="点击下方按钮获取随机内容"></textarea>
        <button class="btn" id="generateBtn">生成随机内容</button>
    </div>
    <script>
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const generateBtn = this;
            const logBox = document.getElementById('logBox');
            
            // 检查按钮是否已经被点击（防止重复点击）
            if (generateBtn.disabled) {
                return;
            }
            
            try {
                // 禁用按钮，防止连续点击
                generateBtn.disabled = true;
                generateBtn.textContent = '读取中...';
                
                // 显示加载状态
                logBox.value = '正在读取文件...';
                
                // 使用fetch API读取smjm文件
                const response = await fetch('smjm');
                
                if (!response.ok) {
                    throw new Error('文件读取失败，状态码: ' + response.status);
                }
                
                // 获取文件内容
                const fileContent = await response.text();
                
                // 按行分割
                const lines = fileContent.split('\n').filter(line => line.trim() !== '');
                
                // 随机选择一行
                if (lines.length > 0) {
                    const randomIndex = Math.floor(Math.random() * lines.length);
                    logBox.value = lines[randomIndex];
                } else {
                    logBox.value = '文件内容为空';
                }
            } catch (error) {
                logBox.value = '错误: ' + error.message;
                console.error('详细错误:', error);
            } finally {
                // 重新启用按钮
                generateBtn.disabled = false;
                generateBtn.textContent = '生成随机内容';
            }
        });
    </script>
</body>
</html>
