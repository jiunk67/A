<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具软件下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px;
        }

        .page-title {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 800px;
        }

        .download-btn {
            padding: 20px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .download-btn:active::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .page-title {
                font-size: 24px;
                margin-bottom: 30px;
            }
            .download-btn {
                font-size: 14px;
                padding: 16px 0;
            }
            .back-btn {
                padding: 10px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h1 class="page-title">工具软件下载</h1>
    <div class="btn-group">
        <a href="./rj/Mt管理器.apk" class="download-btn" download>Mt管理器</a>
        <a href="./rj/ROOT版上号器.apk" class="download-btn" download>ROOT版上号器</a>
        <a href="./rj/shizuku.apk" class="download-btn" download>shizuku</a>
        <a href="./rj/刷写工具.apk" class="download-btn" download>刷写工具</a>
        <a href="./rj/多系统工具箱.apk" class="download-btn" download>多系统工具箱</a>
        <a href="./rj/小火箭_1.8.3.apk" class="download-btn" download>小火箭_1.8.3</a>
        <a href="./rj/小黑屋.apk" class="download-btn" download>小黑屋</a>
        <a href="./rj/绿茶VPN.apk" class="download-btn" download>绿茶VPN</a>
        <a href="./rj/免ROOT上号器.apk" class="download-btn" download>免ROOT上号器</a>
        <a href="./rj/网站托管_1.0.apk" class="download-btn" download>网站托管_1.0</a>
        <a href="./rj/软件冻结工具.apk" class="download-btn" download>软件冻结工具</a>
    </div>
    <script src="music-player.js"></script>
</body>
</html>
