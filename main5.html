<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢捐赠 - π颗糖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("./sp/your-background-image.jpg") no-repeat center center fixed;
            background-size: cover;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(15, 23, 42, 0.85)), url("./sp/your-background-image.jpg");
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px;
        }

        .page-title {
            font-size: 36px;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .thanks-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 600px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .donate-btn {
            padding: 18px 45px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3), 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .donate-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.5), 0 10px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 90%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            margin-top: 15px;
            padding: 10px 30px;
            border: none;
            border-radius: 25px;
            background: rgba(0, 229, 255, 0.3);
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        .tips {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.3);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
                margin-bottom: 15px;
            }
            .thanks-text {
                font-size: 16px;
                margin-bottom: 30px;
            }
            .donate-btn {
                padding: 15px 35px;
                font-size: 18px;
            }
            .back-btn {
                padding: 10px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h1 class="page-title">❤️ 感谢您的支持 ❤️</h1>
    
    <div class="thanks-text">
        每一份捐赠都是对我创作的认可与鼓励<br>
        您的支持将帮助我产出更多优质的教程与资源<br>
        万分感谢，愿我们一起在技术的路上并肩前行！
    </div>

    <button class="donate-btn" onclick="showModal()">点击查看捐赠方式</button>

    <div class="tips">
        小小心意，不限金额，感谢您的慷慨解囊~
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal-content">
            <img src="./sp/K.jpg" alt="捐赠码" class="modal-img">
            <button class="close-btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        const modalMask = document.getElementById("modalMask");

        function showModal() {
            modalMask.style.display = "flex";
        }

        function closeModal() {
            modalMask.style.display = "none";
        }

        modalMask.addEventListener("click", function(e) {
            if (e.target === modalMask) {
                closeModal();
            }
        });
    </script>
</body>
</html>
</body>
</html>
