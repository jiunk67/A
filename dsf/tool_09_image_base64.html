<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转Base64转换器</title>
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .main-content { display: flex; flex-wrap: wrap; gap: 20px; }
        .image-section, .result-section { flex: 1; min-width: 300px; }
        .button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .textarea { width: 100%; height: 150px; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .image-preview { 
            margin: 20px 0; 
            padding: 20px; 
            border: 1px dashed #ddd; 
            text-align: center; 
            cursor: pointer; /* 显示点击指针 */
            min-height: 200px; /* 确保有足够点击区域 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s; /* 边框颜色过渡效果 */
        }
        .image-preview.dragover {
            border-color: #007bff; /* 拖拽时边框变色提示 */
            background-color: rgba(0, 123, 255, 0.05); /* 背景色变化提示 */
        }
        .section-title { margin-bottom: 15px; color: #333; }
        .tool-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        #imageUpload { display: none; } /* 隐藏原始文件选择框 */
        
        /* 弹窗样式 */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .popup-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .popup-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .agree {
            background: #007bff;
            color: white;
        }
        .cancel {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>图片转Base64转换器</h1>
            <p>轻松将您的图片转换为Base64格式</p>
        </div>

        <div class="main-content">
            <div class="image-section">
                <h2 class="section-title">选择图片</h2>
                <!-- 隐藏原始文件选择框，通过点击预览区域触发 -->
                <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
                <!-- 可点击、可拖拽的图片预览区域 -->
                <div class="image-preview" id="imagePreview" onclick="document.getElementById('imageUpload').click()">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor"/>
                        <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                        <polyline points="21 15 16 10 5 21" stroke="currentColor"/>
                    </svg>
                    <p>点击或拖拽图片到这里</p>
                </div>
            </div>

            <div class="result-section">
                <h2 class="section-title">Base64结果</h2>
                
                <div>
                    <h3>Base64字符串</h3>
                    <div class="tool-buttons">
                        <button class="button" onclick="copyToClipboard('base64String')">复制</button>
                        <button class="button" onclick="checkDeviceAndDownload('base64String', 'base64.txt')">下载</button>
                    </div>
                    <textarea id="base64String" class="textarea" placeholder="Base64字符串将显示在这里" readonly></textarea>
                </div>

                <div>
                    <h3>HTML图片标签</h3>
                    <div class="tool-buttons">
                        <button class="button" onclick="copyToClipboard('htmlImageTag')">复制</button>
                        <button class="button" onclick="checkDeviceAndDownload('htmlImageTag', 'image-tag.html')">下载</button>
                    </div>
                    <textarea id="htmlImageTag" class="textarea" placeholder="HTML图片标签将显示在这里" readonly></textarea>
                </div>

                <div>
                    <h3>CSS背景</h3>
                    <div class="tool-buttons">
                        <button class="button" onclick="copyToClipboard('cssBackground')">复制</button>
                        <button class="button" onclick="checkDeviceAndDownload('cssBackground', 'background.css')">下载</button>
                    </div>
                    <textarea id="cssBackground" class="textarea" placeholder="CSS背景代码将显示在这里" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="popup" id="downloadPopup">
        <div class="popup-content">
            <p>当前功能仅支持高性能设备使用（pc端）</p>
            <p>是否仍要下载？</p>
            <div class="popup-buttons">
                <button class="popup-button agree" onclick="confirmDownload()">同意</button>
                <button class="popup-button cancel" onclick="closePopup()">取消</button>
            </div>
        </div>
    </div>

    <script>
        let currentDownloadParams = null; // 存储当前下载参数
        const imagePreview = document.getElementById('imagePreview');
        const imageUpload = document.getElementById('imageUpload');

        // 初始化拖拽事件监听
        function initDragAndDrop() {
            // 阻止浏览器默认拖拽行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                imagePreview.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // 拖拽进入时添加视觉提示
            ['dragenter', 'dragover'].forEach(eventName => {
                imagePreview.addEventListener(eventName, highlight, false);
            });

            // 拖拽离开或完成时移除视觉提示
            ['dragleave', 'drop'].forEach(eventName => {
                imagePreview.addEventListener(eventName, unhighlight, false);
            });

            // 处理文件放下事件
            imagePreview.addEventListener('drop', handleDrop, false);
        }

        // 阻止默认行为
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 高亮提示（拖拽时）
        function highlight() {
            imagePreview.classList.add('dragover');
        }

        // 取消高亮
        function unhighlight() {
            imagePreview.classList.remove('dragover');
        }

        // 处理拖拽文件
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0]; // 获取拖拽的第一个文件
            if (file && file.type.startsWith('image/')) { // 验证是否为图片文件
                imageUpload.files = dt.files; // 将文件传给隐藏的input
                handleImageUpload({ target: imageUpload }); // 调用已有的处理方法
            }
        }

        // 判断设备类型（简单判断：屏幕宽度大于1024视为电脑端）
        function isPC() {
            return window.innerWidth > 1024;
        }

        // 检查设备并处理下载
        function checkDeviceAndDownload(elementId, filename) {
            if (isPC()) {
                // 电脑端直接下载
                downloadText(elementId, filename);
            } else {
                // 手机端显示弹窗
                currentDownloadParams = { elementId, filename };
                document.getElementById('downloadPopup').style.display = 'flex';
            }
        }

        // 确认下载
        function confirmDownload() {
            if (currentDownloadParams) {
                const { elementId, filename } = currentDownloadParams;
                downloadText(elementId, filename);
                currentDownloadParams = null;
                closePopup();
            }
        }

        // 关闭弹窗
        function closePopup() {
            document.getElementById('downloadPopup').style.display = 'none';
            currentDownloadParams = null;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                // 显示图片预览
                imagePreview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px;" alt="预览">`;

                // 提取base64数据
                const base64String = e.target.result.split(',')[1];
                const fullBase64 = e.target.result;

                // 填充结果
                document.getElementById('base64String').value = base64String;
                document.getElementById('htmlImageTag').value = `<img src="${fullBase64}" alt="转换后的图片">`;
                document.getElementById('cssBackground').value = `background-image: url("${fullBase64}");`;
            };

            reader.readAsDataURL(file);
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板！');
            });
        }

        function downloadText(elementId, filename) {
            const text = document.getElementById(elementId).value;
            if (!text) {
                alert('没有可下载的内容');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 初始化拖拽功能
        initDragAndDrop();
    </script>
</body>
</html>
