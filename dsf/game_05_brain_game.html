<style>

        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
        background:#f5f5f7;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:0;
    }
    h1{
        margin:0 0 5vh 0;
        font-size:8vh;
        font-weight:600;
        color:#1d1d1f;
        letter-spacing:.5px;
    }
    .box{
        width:90%;
        height:22vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#fff;
        box-shadow:0 8px 24px rgba(0,0,0,.05);
        border-radius:4vh;
        font-size:5vh;
        line-height:1.4;
        color:#333;
        transition:.3s;
        padding:0 5vw;
        text-align:center;
    }
    .question{
        margin-bottom:4vh;
        background:#fafafa;
    }
    .answer{
        cursor:pointer;
        background:#f0f0f2;
    }
    .answer span{display:none;}
    .answer.reveal span{display:inline;}
    .answer.reveal{background:#e8e8ea;}
    button{
        margin-top:6vh;
        width:50vw;
        height:12vh;
        font-size:5.5vh;
        border:none;
        border-radius:6vh;
        background:#0071e3;
        color:#fff;
        cursor:pointer;
        transition:.25s;
    }
    button:hover{background:#0077ed;}
</style>
