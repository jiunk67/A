<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业法人查询系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #3a7bd5;
            --background-color: linear-gradient(135deg, #e6e9f0, #eef1f5);
            --text-color: #333;
            --border-color: #e1e4e8;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-radius: 15px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --loading-color: rgba(74, 144, 226, 0.5);
        }

        body {
            font-family: 'Roboto', sans-serif;
            padding: 40px 20px;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: white;
            padding: 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            font-size: 3.2em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: text-shadow 0.3s ease;
        }

        input {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 35px;
            font-size: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 50px;
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 2.5em;
            }

            input,
            button {
                font-size: 16px;
                padding: 18px;
            }

            #result {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>企业查询</h1>
        <input type="text" id="entName" placeholder="请输入企业名称">
        <button onclick="searchEntity()" class="search-button">查询</button>
        <div id="result"></div>
        <div id="linkDisplay" style="margin-top: 10px;"></div>
    </div>

    <script>
        function searchEntity() {
            const entName = document.getElementById('entName').value;
            const linkDisplayDiv = document.getElementById('linkDisplay');

            if (entName.trim() === '') {
                alert('请输入企业名称');
                return;
            }

            // 清空链接区域
            linkDisplayDiv.innerHTML = '';

            // 生成超链接
            const linkElement = document.createElement('a');
            linkElement.href = 'https://www.xinyidaigz.com/gw92/data/gzData/yuexiu/query/base?entName=' + encodeURIComponent(entName) + '&queryMethod=LIKE&pageSize=15&pageNum=1';
            linkElement.target = '_blank';
            linkElement.innerText = '查看企业信息';
            linkElement.style.display = 'block';
            linkElement.style.marginTop = '20px';
            linkElement.style.textAlign = 'center';
            linkElement.style.padding = '10px';
            linkElement.style.background = 'linear-gradient(to bottom, var(--primary-color), var(--secondary-color))';
            linkElement.style.color = 'white';
            linkElement.style.borderRadius = 'var(--border-radius)';
            linkElement.style.textDecoration = 'none';
            linkElement.style.boxShadow = '0 6px 12px rgba(0, 0, 0, 0.2)';
            linkElement.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease';

            linkElement.addEventListener('mouseover', () => {
                linkElement.style.transform = 'scale(1.05)';
                linkElement.style.boxShadow = '0 8px 16px rgba(0, 0, 0, 0.3)';
            });

            linkElement.addEventListener('mouseout', () => {
                linkElement.style.transform = 'scale(1)';
                linkElement.style.boxShadow = '0 6px 12px rgba(0, 0, 0, 0.2)';
            });

            linkDisplayDiv.appendChild(linkElement);
        }
    </script>
</body>
</html>
