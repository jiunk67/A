<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记账小程序 V 1.01</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4F46E5;
            --hover-color: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
            --error-color: #EF4444;
            --success-color: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            font-size: 1.875rem;
            margin-bottom: 2rem;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--hover-color);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(100, 100);
                opacity: 0;
            }
        }

        #result {
            margin-top: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        #result::-webkit-scrollbar {
            width: 6px;
        }

        #result::-webkit-scrollbar-track {
            background: #F3F4F6;
            border-radius: 3px;
        }

        #result::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 3px;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-radius: 8px;
            background-color: #F9FAFB;
            margin-bottom: 1rem;
        }

        .income {
            color: green;
        }

        .expense {
            color: red;
        }

        .delete-button {
            background-color: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
        }

        .delete-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小海记账</h1>
        <form id="transactionForm">
            <div class="form-group">
                <label for="type">选择类型</label>
                <select id="type" class="form-control">
                    <option value="income">收入</option>
                    <option value="expense">支出</option>
                </select>
            </div>
            <div class="form-group">
                <label for="amount">金额</label>
                <input type="number" id="amount" required placeholder="请输入金额">
            </div>
            <div class="form-group">
                <label for="description">备注</label>
                <input type="text" id="description" required placeholder="请输入备注">
            </div>
            <button type="submit">添加交易</button>
        </form>
        <div id="transactions">
            <h2>交易记录</h2>
            <hr>
            <ul id="transactionList"></ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('transactionForm');
            const transactionList = document.getElementById('transactionList');

            // 加载交易记录
            loadTransactions();

            // 表单提交事件
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const type = document.getElementById('type').value;
                const amount = parseFloat(document.getElementById('amount').value);
                const description = document.getElementById('description').value.trim();
                const time = new Date().toLocaleString(); // 获取当前时间

                if (isNaN(amount) || amount <= 0) {
                    alert("请输入有效的金额！");
                    return;
                }

                // 创建交易对象
                const transaction =
                {
                    id: new Date().toISOString(),
                    type,
                    amount,
                    description,
                    time // 添加时间字段
                };

                // 保存交易并更新界面
                saveTransaction(transaction);
                addTransactionToDOM(transaction);
                form.reset();
            });

            // 保存交易到 localStorage
            function saveTransaction(transaction) {
                let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
                transactions.push(transaction);
                localStorage.setItem('transactions', JSON.stringify(transactions));
            }

            // 将交易添加到页面中
            function addTransactionToDOM(transaction) {
                const li = document.createElement('li');
                li.className = `transaction-item ${transaction.type}`;
                li.innerHTML = `
                    <div>
                        <p><strong>${transaction.type === 'income' ? '收入' : '支出'}</strong></p>
                        <p>时间：${transaction.time}</p>
                        <p>金额：${transaction.amount.toFixed(2)}元</p>
                        <p>备注：${transaction.description}</p>
                    </div>
                    <button class="delete-button" data-id="${transaction.id}">🗑️</button>
                `;

                // 添加删除按钮的点击事件
                const deleteButton = li.querySelector('.delete-button');
                deleteButton.addEventListener('click', function () {
                    deleteTransaction(transaction.id);
                });

                transactionList.appendChild(li);
            }

            // 删除单个交易记录
            function deleteTransaction(id) {
                let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
                transactions = transactions.filter(transaction => transaction.id !== id);
                localStorage.setItem('transactions', JSON.stringify(transactions));
                refreshTransactions();
            }

            // 刷新交易列表
            function refreshTransactions() {
                transactionList.innerHTML = '';
                loadTransactions();
            }

            // 加载并显示所有交易记录
            function loadTransactions() {
                let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
                transactions.forEach(addTransactionToDOM);
            }
        });
    </script>
</body>
</html>
