<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小海AI图像生成器</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            transition: box-shadow 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus {
            border-color: #007BFF;
            outline: none;
        }
        .btn {
            padding: 12px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .image-container {
            margin-top: 20px;
            border: 2px dashed #ddd;
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }
        .progress-container {
            margin-top: 10px;
            width: 100%;
            position: relative;
        }
        .progress-bar {
            width: 0%;
            height: 10px;
            background-color: #007BFF;
            border-radius: 5px;
            transition: width 0.5s;
        }
        .progress-percentage {
            position: absolute;
            top: -20px;
            right: 0;
            font-size: 12px;
            color: #666;
        }
        .loading-text {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>小海AI图像生成器</h2>
        <div class="input-group">
            <label for="content">请填写描述文字：</label>
            <input type="text" id="content" placeholder="请输入描述文字，例如：一只猫在晒太阳">
        </div>
        <button class="btn" onclick="generateImage()">生成图片</button>
        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-percentage">0%</div>
        </div>
        <div class="loading-text" id="loading-text" style="display: none;">加载中请稍等...</div>
        <div class="image-container">
            <img id="generated-image" src="" alt="生成的图片" style="display: none;">
        </div>
    </div>

    <script>
        const token = '1PNHyl1DsuF3WMgqjmggfAMJTyglnWN9H32VeEGF';
        const apiUrl = 'http://api.toolfk.com/api/text2img';

        async function generateImage() {
            const content = document.getElementById('content').value.trim();
            if (!content) {
                alert('请输入描述文字');
                return;
            }

            const progressBar = document.querySelector('.progress-bar');
            const progressPercentage = document.querySelector('.progress-percentage');
            const loadingText = document.getElementById('loading-text');
            progressBar.style.width = '10%';
            progressPercentage.innerText = '10%';
            loadingText.style.display = 'block';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `token=${token}&content=${encodeURIComponent(content)}`
                });

                progressBar.style.width = '50%';
                progressPercentage.innerText = '50%';

                const data = await response.json();
                if (data.status === 1) {
                    const imageElement = document.getElementById('generated-image');
                    imageElement.src = data.data;
                    imageElement.style.display = 'block';
                    progressBar.style.width = '100%';
                    progressPercentage.innerText = '100%';
                } else if (data.errmsg && data.errmsg.includes('调用次数已用完')) {
                    alert('今日调用次数已用完，请明天再来！');
                } else {
                    alert('生成失败：' + data.errmsg);
                }
            } catch (error) {
                console.error('请求失败：', error);
                alert('生成失败，请稍后再试！');
            } finally {
                setTimeout(() => {
                    progressBar.style.width = '0%';
                    progressPercentage.innerText = '0%';
                    loadingText.style.display = 'none';
                }, 1000);
            }
        }
    </script>
</body>
</html>
