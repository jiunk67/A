<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>随机决定转盘</title>
<style>
:root{
    --bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    --card:rgba(255,255,255,.15);
    --text:#fff;
    --accent:#ff6b6b;
    --radius:24px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:var(--font);
    background:var(--bg);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
}
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
}
h1{font-size:28px;margin-bottom:10px;text-align:center}
.input-card{
    background:var(--card);
    backdrop-filter:blur(10px);
    padding:20px 25px;
    border-radius:var(--radius);
    display:flex;
    gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.1);
}
input{
    padding:10px 15px;
    border:none;
    border-radius:var(--radius);
    background:rgba(255,255,255,.8);
    color:#333;
    font-size:15px;
    width:220px;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:var(--radius);
    background:var(--accent);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:transform .3s;
}
button:hover{transform:scale(1.05)}
.wheel-wrapper{
    position:relative;
    width:300px;
    height:300px;
}
.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(
        #ff6b6b 0 10%,
        #ffa726 10% 20%,
        #ffeb3b 20% 30%,
        #66bb6a 30% 40%,
        #42a5f5 40% 50%,
        #ab47bc 50% 60%,
        #ef5350 60% 70%,
        #ffca28 70% 80%,
        #26c6da 80% 90%,
        #ec407a 90% 100%
    );
    transition:transform 4s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.arrow{
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    transform:translate(-50%,-50%);
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-bottom:30px solid #fff;
    z-index:2;
}
.result-card{
    background:var(--card);
    backdrop-filter:blur(10px);
    padding:20px 30px;
    border-radius:var(--radius);
    font-size:20px;
    letter-spacing:1px;
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.1);
}
</style>
</head>
<body>
<div class="container">
    <h1>随机决定转盘</h1>

    <!-- 输入区 -->
    <div class="input-card">
        <input id="option" type="text" placeholder="输入选项，用逗号分隔">
        <button onclick="addOption()">添加</button>
        <button onclick="spin()">开始转盘</button>
    </div>

    <!-- 转盘 -->
    <div class="wheel-wrapper">
        <div class="wheel" id="wheel"></div>
        <div class="arrow"></div>
    </div>

    <!-- 结果 -->
    <div class="result-card" id="result">等待选择…</div>
</div>

<script>
const wheel=document.getElementById('wheel');
const result=document.getElementById('result');
let options=["吃饭","睡觉","学习","运动"];
let spinning=false;

function addOption(){
    const val=document.getElementById('option').value.trim();
    if(val){
        options=val.split(/[,，、\s]+/);
        document.getElementById('option').value='';
        result.textContent=`已更新 ${options.length} 个选项`;
    }
}

function spin(){
    if(spinning) return;
    spinning=true;
    result.textContent="转动中…";
    const deg=3600+Math.floor(Math.random()*360);
    wheel.style.transform=`rotate(${deg}deg)`;
    setTimeout(()=>{
        const index=Math.floor(((deg%360)/360)*options.length);
        result.textContent=`恭喜：${options[index]}！`;
        spinning=false;
    },4000);
}

/* 初始化文本 */
result.textContent=`当前 ${options.length} 个选项`;
</script>
</body>
</html>
