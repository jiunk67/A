<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀人物查询</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 16px; /* 圆角大卡片框 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        input[type="text"], button {
            width: calc(100% - 20px); /* 输入框短一些 */
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 20px; /* 输入框和按键的圆角 */
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%; /* 按键宽度调整为与输入框一致 */
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>王者荣耀人物查询</h1>
        <input type="text" id="heroName" placeholder="请输入英雄名称">
        <button onclick="queryHero()">查询</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        async function queryHero() {
            const heroName = document.getElementById('heroName').value;
            const resultDiv = document.getElementById('result');
            if (!heroName) {
                resultDiv.textContent = "请输入英雄名称！";
                return;
            }

            try {
                const response = await fetch(`https://zj.v.api.aa1.cn/api/wz/?msg=${heroName}`);
                if (!response.ok) {
                    throw new Error('查询失败，请检查英雄名称是否正确！');
                }
                const data = await response.text();
                resultDiv.textContent = data;
            } catch (error) {
                resultDiv.textContent = `查询失败，请检查网络或网页链接的合法性。如果问题持续，请稍后重试。`;
            }
        }
    </script>
</body>
</html>
