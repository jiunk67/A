<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ号查询手机号</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #3a7bd5;
            --background-color: linear-gradient(135deg, #e6e9f0, #eef1f5);
            --text-color: #333;
            --border-color: #e1e4e8;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-radius: 15px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --loading-color: rgba(74, 144, 226, 0.5);
        }

        body {
            font-family: 'Roboto', sans-serif;
            padding: 40px 20px;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: white;
            padding: 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            font-size: 3.2em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            transition: text-shadow 0.3s ease;
        }

        input {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 35px;
            font-size: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading-text {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-container {
            width: 50px;
            height: 50px;
            border: 6px solid var(--loading-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 20px;
            transform-origin: center;
            animation-timing-function: cubic-bezier(0.5, 0.1, 0.1, 0.9);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-bar {
            margin-top: 35px;
            height: 15px;
            background-color: var(--border-color);
            border-radius: 7.5px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.4s ease;
        }

        #result {
            margin-top: 50px;
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-weight: bold;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message {
            color: var(--success-color);
        }

        .error-message {
            color: var(--error-color);
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 2.5em;
            }

            input,
            button {
                font-size: 16px;
                padding: 18px;
            }

            #result {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>QQ号查询手机号</h1>
        <input type="text" id="qqInput" placeholder="请输入QQ号">
        <button id="searchBtn">查询手机号</button>
        <div id="loadingSpinner" class="loading-text">
            <span>正在查询</span>
            <div class="loading-container"></div>
        </div>
        <div id="result">
            <div id="successMessage" class="message success-message"></div>
            <div id="errorMessage" class="message error-message"></div>
        </div>
    </div>

    <script>
        // 获取查询按钮和结果容器元素
        const searchBtn = document.getElementById('searchBtn');
        const resultContainer = document.getElementById('result');
        const qqInput = document.getElementById('qqInput');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // 设置加载状态
        let loading = false;

        // 页面加载完成后隐藏加载圆圈
        window.addEventListener('load', function () {
            loadingSpinner.style.display = 'none';
        });

        searchBtn.addEventListener('click', function () {
            // 如果在加载中，直接返回
            if (loading) {
                return;
            }

            // 获取输入的QQ号码
            const qq = qqInput.value;

            if (qq === '') {
                // 处理输入为空的情况
                resultContainer.innerHTML = '<p class="text-danger">输入不能为空</p>';
                return;
            }

            // 显示加载圆圈和禁用输入和按钮
            loadingSpinner.style.display = 'inline-block';
            qqInput.disabled = true;
            searchBtn.disabled = true;

            // 设置加载状态为 true
            loading = true;

            // 发送API请求
            const apiUrl = `https://zy.xywlapi.cc/qqapi?qq=${qq}`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 200) {
                        // 渲染查询结果
                        resultContainer.innerHTML = `
                            <p><strong>QQ号码:</strong> ${data.qq}</p>
                            <p><strong>手机号码:</strong> ${data.phone}</p>
                            <p><strong>手机号码归属地:</strong> ${data.phonediqu}</p>
                                                        <p><strong>注：</strong>数据由小海科技提供</p>
                        `;
                    } else {
                        // 处理没有找到的情况
                        resultContainer.innerHTML = `
                            <p class="text-danger">官方提醒：数据库中查不到的数据请联系QQ1690449909或tg:@xh088A,进行查询!30元报单秒出手机号</p>
                        `;
                    }

                    // 隐藏加载圆圈和启用输入和按钮
                    loadingSpinner.style.display = 'none';
                    qqInput.disabled = false;
                    searchBtn.disabled = false;
                    // 设置加载状态为 false
                    loading = false;
                })
                .catch(error => {
                    // 处理其他错误
                    resultContainer.innerHTML = `
                        <p class="text-danger">查询出错: ${error}</p>
                    `;

                    // 隐藏加载圆圈和启用输入和按钮
                    loadingSpinner.style.display = 'none';
                    qqInput.disabled = false;
                    searchBtn.disabled = false;
                    // 设置加载状态为 false
                    loading = false;
                });
        });
    </script>
</body>
</html>
