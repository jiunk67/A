<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>天气</title>
    <style>
        :root {
            --primary-color: #14b7ff;
            --secondary-color: #b221ff;
            --background-color: #f5f5f5;
            --text-color: #333;
            --border-radius: 15px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .panel-title {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            padding: 10px 20px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 20px;
        }

        .panel-title h3 {
            color: white;
            margin: 0;
            font-weight: bold;
            font-size: 24px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .card iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: var(--border-radius);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .panel-title h3 {
                font-size: 20px;
            }

            .card {
                padding: 10px;
            }

            .card iframe {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="panel-title">
        <h3>小海天气预报</h3>
    </div>
    <div class="card">
        <iframe id="weatherIframe" src="https://i.tianqi.com/index.php?c=code&id=13&icon=1&num=5&site=12" frameborder="0"></iframe>
    </div>
    <div class="footer">
        <p>数据来源：<a href="https://i.tianqi.com" target="_blank">天气网</a></p>
        <p>版权所有 ©小海科技 </p>
    </div>
</body>
</html>
